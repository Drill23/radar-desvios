<style>
:root{
  --bg0:#060a14;--bg1:#0b1222;--panel:rgba(16,24,44,.66);--panel2:rgba(255,255,255,.035);--panelS:rgba(10,16,32,.92);
  --line:rgba(150,172,222,.12);--line2:rgba(150,172,222,.24);--track:rgba(150,172,222,.10);
  --tx:#eaf0fc;--tx2:#a9b6cf;--tx3:#6d7a96;
  --acc:#5ad1ff;--acc2:#8f7dff;--accbg:rgba(90,209,255,.14);
  --t1:#3cc8f5;--t2:#b18cff;--tA:#f3e3b3;--t1bg:rgba(60,200,245,.16);--t2bg:rgba(177,140,255,.16);
  --bad:#ff4d6d;--good:#24e3a1;--flat:#ffc247;--none:#9db0ca;
  --badbg:rgba(255,77,109,.15);--goodbg:rgba(36,227,161,.14);--flatbg:rgba(255,194,71,.15);--nonebg:rgba(157,176,202,.12);
  --thr:#ffc247;--shadow:0 18px 40px -18px rgba(0,0,0,.7);
  --blobA:rgba(56,140,255,.20);--blobB:rgba(150,90,255,.16);--blobC:rgba(0,220,190,.10);
  --gridln:rgba(120,150,210,.05);--tipbg:rgba(7,11,22,.96);
  --sw:17.2rem;--r:16px;
  --font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --fontD:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;
}
:root[data-theme="light"]{
  --bg0:#eef2f9;--bg1:#e6ecf6;--panel:rgba(255,255,255,.86);--panel2:rgba(10,30,70,.03);--panelS:rgba(255,255,255,.97);
  --line:rgba(25,45,90,.10);--line2:rgba(25,45,90,.20);--track:rgba(25,45,90,.08);
  --tx:#0e1a30;--tx2:#46557a;--tx3:#8190ab;
  --acc:#0a8fd0;--acc2:#6a4ee6;--accbg:rgba(10,143,208,.12);
  --t1:#0895cc;--t2:#7b55e8;--tA:#9b7a23;--t1bg:rgba(8,149,204,.13);--t2bg:rgba(123,85,232,.13);
  --bad:#e3264b;--good:#079f6e;--flat:#d99400;--none:#7f8ea8;
  --badbg:rgba(227,38,75,.11);--goodbg:rgba(7,159,110,.11);--flatbg:rgba(217,148,0,.12);--nonebg:rgba(127,142,168,.12);
  --thr:#e0a100;--shadow:0 14px 34px -20px rgba(20,40,90,.35);
  --blobA:rgba(60,140,255,.13);--blobB:rgba(140,90,255,.10);--blobC:rgba(0,200,170,.08);
  --gridln:rgba(30,60,120,.05);--tipbg:rgba(255,255,255,.98);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(10.5px,min(.56vw + 5px,1.12vh + 4px),17px)}
html,body{height:100%;overflow:hidden}
body{background:var(--bg0);color:var(--tx);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.num{font-family:var(--fontD);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* ---------- fundo vivo ---------- */
#bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(1200px 800px at 85% -10%,var(--bg1),transparent 70%),var(--bg0)}
#bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:1;will-change:transform}
#bgfx i:nth-child(1){width:46vw;height:46vw;left:-12vw;top:-18vw;background:var(--blobA);animation:drift1 26s ease-in-out infinite alternate}
#bgfx i:nth-child(2){width:40vw;height:40vw;right:-10vw;bottom:-20vw;background:var(--blobB);animation:drift2 32s ease-in-out infinite alternate}
#bgfx i:nth-child(3){width:30vw;height:30vw;left:40vw;top:30vh;background:var(--blobC);animation:drift3 38s ease-in-out infinite alternate}
#bgfx:after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--gridln) 1px,transparent 1px),linear-gradient(90deg,var(--gridln) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 60% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 60% 40%,#000 20%,transparent 75%)}
@keyframes drift1{to{transform:translate(14vw,10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-12vw,-14vh) scale(1.1)}}
@keyframes drift3{to{transform:translate(-18vw,12vh) scale(.85)}}
/* ---------- estrutura ---------- */
#app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sw) minmax(0,1fr);grid-template-rows:4.1rem minmax(0,1fr);height:100vh;transition:grid-template-columns .45s cubic-bezier(.2,.8,.2,1)}
#app.collapsed{--sw:4.6rem}
#side{grid-row:1/3;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--panelS);backdrop-filter:blur(16px);overflow:hidden}
:root[data-theme="light"] #side{background:rgba(255,255,255,.9)}
#top{display:flex;align-items:center;gap:1rem;padding:0 1.1rem;border-bottom:1px solid var(--line);min-width:0;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
#main{position:relative;min-height:0;min-width:0;padding:.85rem;overflow:hidden}
/* ---------- marca ---------- */
.brand{display:flex;align-items:center;gap:.7rem;height:4.1rem;padding:0 .9rem;border-bottom:1px solid var(--line);flex:none}
.logo{width:2.35rem;height:2.35rem;flex:none;position:relative;border-radius:12px;display:grid;place-items:center;background:conic-gradient(from var(--ang,0deg),var(--acc),var(--acc2),var(--good),var(--acc));animation:spin 8s linear infinite}
.logo:before{content:"";position:absolute;inset:2px;border-radius:10px;background:var(--panelS)}
:root[data-theme="light"] .logo:before{background:#fff}
.logo svg{position:relative;width:1.35rem;height:1.35rem}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.brand-t{min-width:0;white-space:nowrap;overflow:hidden;transition:opacity .3s}
.brand-t b{display:block;font-size:1.02rem;letter-spacing:.01em}
.brand-t span{display:block;font-size:.7rem;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase}
.collapse-btn{margin-left:auto;width:1.9rem;height:1.9rem;border-radius:8px;display:grid;place-items:center;color:var(--tx3);flex:none;transition:.25s}
.collapse-btn:hover{background:var(--panel2);color:var(--tx)}
.collapsed .collapse-btn{transform:rotate(180deg)}
.collapsed .brand{padding:0 .6rem;flex-direction:column;justify-content:center;gap:.25rem}
.collapsed .brand-t{display:none}
.collapsed .collapse-btn{margin:0;width:1.6rem;height:1.2rem}
/* ---------- navegação ---------- */
.navsec{padding:.6rem .55rem .2rem;flex:none}
.navlbl{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:.35rem .55rem;display:flex;align-items:center;justify-content:space-between;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:.12rem}
.nav button{position:relative;display:flex;align-items:center;gap:.75rem;padding:.48rem .6rem;border-radius:10px;color:var(--tx2);font-size:.86rem;white-space:nowrap;transition:background .2s,color .2s}
.nav button svg{width:1.15rem;height:1.15rem;flex:none}
.nav button:hover{background:var(--panel2);color:var(--tx)}
.nav button.on{color:var(--tx);background:linear-gradient(90deg,var(--accbg),transparent)}
.nav button.on:before{content:"";position:absolute;left:-.55rem;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.nav button .k{margin-left:auto;font-size:.66rem;color:var(--tx3);border:1px solid var(--line);border-radius:5px;padding:0 .3rem}
.collapsed .nav button span,.collapsed .nav button .k,.collapsed .navlbl,.collapsed .side-tree,.collapsed .side-foot .lg{display:none}
.collapsed .nav button{justify-content:center;padding:.6rem}
/* ---------- árvore de anomalias ---------- */
.side-tree{display:flex;flex-direction:column;min-height:0;flex:1;padding:0 .55rem}
.srch{position:relative;margin:.2rem 0 .45rem}
.srch input{width:100%;height:2.1rem;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 .7rem 0 2rem;font-size:.82rem;outline:none;transition:border .2s,box-shadow .2s}
.srch input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.srch svg{position:absolute;left:.62rem;top:50%;transform:translateY(-50%);width:.95rem;height:.95rem;color:var(--tx3)}
.tree{flex:1;min-height:0;overflow:auto;padding:0 .1rem .6rem;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.tree::-webkit-scrollbar{width:6px}.tree::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
.tg{margin-bottom:.1rem}
.tg-h{display:flex;align-items:center;gap:.45rem;width:100%;padding:.38rem .45rem;border-radius:8px;font-size:.8rem;color:var(--tx2);text-align:left}
.tg-h:hover{background:var(--panel2);color:var(--tx)}
.tg-h .chev{width:.8rem;height:.8rem;flex:none;transition:transform .3s;color:var(--tx3)}
.tg.open>.tg-h .chev{transform:rotate(90deg)}
.tg-h b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-h .cnt{margin-left:auto;font-size:.66rem;padding:.05rem .4rem;border-radius:99px;background:var(--badbg);color:var(--bad);flex:none}
.tg-h .cnt.z{background:var(--nonebg);color:var(--tx3)}
.tg-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.tg.open>.tg-b{grid-template-rows:1fr}
.tg-b>div{overflow:hidden;min-height:0;padding-left:.55rem}
.tg.sub>.tg-h{font-size:.76rem;padding:.28rem .45rem}
.leaf{display:flex;align-items:center;gap:.5rem;width:100%;padding:.3rem .45rem;border-radius:8px;font-size:.78rem;color:var(--tx2);text-align:left;transition:background .15s,color .15s}
.leaf:hover{background:var(--panel2);color:var(--tx)}
.leaf.on{background:var(--accbg);color:var(--tx)}
.leaf .lt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaf .lv{font-size:.72rem;color:var(--tx3);flex:none}
.leaf .lv.hot{color:var(--c);font-weight:600}
.leaf.mach .lt{opacity:.7}
.leaf.mach .lt:after{content:" ⚙"}
.hint-empty{font-size:.76rem;color:var(--tx3);padding:.6rem .4rem}
.side-foot{flex:none;border-top:1px solid var(--line);padding:.55rem .8rem;display:flex;gap:.7rem;flex-wrap:wrap;font-size:.68rem;color:var(--tx3)}
.side-foot .lg{display:flex;align-items:center;gap:.3rem}
.collapsed .side-foot{justify-content:center}
.tree-btn{display:none}
.collapsed .tree-btn{display:flex}
/* ---------- status ---------- */
.st-worse{--c:var(--bad);--cbg:var(--badbg)}
.st-better{--c:var(--good);--cbg:var(--goodbg)}
.st-flat{--c:var(--flat);--cbg:var(--flatbg)}
.st-none{--c:var(--none);--cbg:var(--nonebg)}
.st-t1{--c:var(--t1);--cbg:var(--t1bg)}
.st-t2{--c:var(--t2);--cbg:var(--t2bg)}
.dot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none;position:relative}
.dot.pulse:after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--c);animation:ring 1.9s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.3);opacity:0}}
.chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.7rem;font-weight:600;padding:.12rem .5rem;border-radius:99px;background:var(--cbg);color:var(--c);white-space:nowrap;line-height:1.3}
.chip.ghost{background:transparent;border:1px solid var(--line2);color:var(--tx3);font-weight:500}
.tag{display:inline-block;font-size:.64rem;padding:.06rem .42rem;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--tx3);white-space:nowrap;vertical-align:middle;letter-spacing:.01em}
.badge-new{font-size:.6rem;font-weight:700;letter-spacing:.06em;padding:.05rem .35rem;border-radius:5px;background:var(--bad);color:#fff;animation:blink 1.4s ease-in-out infinite;white-space:nowrap}
.badge-out{font-size:.6rem;font-weight:700;letter-spacing:.06em;padding:.05rem .35rem;border-radius:5px;background:var(--good);color:#04241a;white-space:nowrap}
@keyframes blink{50%{opacity:.45}}
/* ---------- topo ---------- */
.ttl{min-width:0;flex:1}
.ttl h1{font-size:1.18rem;font-weight:650;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{font-size:.76rem;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datenav{display:flex;align-items:center;gap:.25rem;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.2rem;flex:none}
.datenav .ib{width:2rem;height:2rem}
.datebtn{display:flex;flex-direction:column;align-items:center;padding:.15rem .8rem;border-radius:9px;line-height:1.15;min-width:8.6rem;transition:background .2s}
.datebtn:hover{background:var(--panel2)}
.datebtn b{font-size:.95rem;font-weight:650}
.datebtn span{font-size:.64rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em}
.ib{display:grid;place-items:center;border-radius:9px;color:var(--tx2);transition:.2s;flex:none}
.ib:hover{background:var(--panel2);color:var(--tx)}
.ib:disabled{opacity:.3;cursor:default}
.ib svg{width:1.05rem;height:1.05rem}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:.18rem;position:relative;flex:none}
.seg button{position:relative;z-index:1;padding:.36rem .8rem;font-size:.8rem;font-weight:600;color:var(--tx3);border-radius:8px;transition:color .25s;white-space:nowrap}
.seg button.on{color:var(--tx)}
.seg .pill{position:absolute;z-index:0;top:.18rem;bottom:.18rem;border-radius:8px;background:var(--accbg);border:1px solid var(--line2);transition:left .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1)}
.seg.sm button{padding:.22rem .6rem;font-size:.72rem}
.live{display:flex;align-items:center;gap:.55rem;padding:.38rem .75rem;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-size:.74rem;color:var(--tx2);white-space:nowrap;flex:none;max-width:21rem;overflow:hidden}
.live b{color:var(--tx);font-weight:600}
.live .dot{--c:var(--none)}
.live.ok .dot{--c:var(--good)}
.live.base .dot{--c:var(--flat)}
.live.ok .dot:after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--c);animation:ring 1.6s ease-out infinite}
.live .lt2{overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:.2rem;flex:none}
.tools .ib{width:2.15rem;height:2.15rem}
.tools .ib.on{color:var(--acc);background:var(--accbg)}
/* ---------- painéis ---------- */
.view{height:100%;display:grid;gap:.8rem;min-height:0;min-width:0}
.pnl{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),var(--shadow);backdrop-filter:blur(14px);padding:.75rem .9rem;overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.noanim .pnl,.noanim *{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pnl-h{display:flex;align-items:center;gap:.6rem;min-height:1.7rem;flex:none;margin-bottom:.45rem}
.pnl-h h3{font-size:.9rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnl-h .sub{font-size:.72rem;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pnl-h .r{margin-left:auto;display:flex;gap:.4rem;align-items:center;flex:none}
.pnl-h .ic{width:1.6rem;height:1.6rem;border-radius:8px;display:grid;place-items:center;background:var(--accbg);color:var(--acc);flex:none}
.pnl-h .ic svg{width:.95rem;height:.95rem}
.pnl-b{flex:1;min-height:0;min-width:0;position:relative}
.glow-bad{box-shadow:inset 0 0 0 1px rgba(255,77,109,.35),0 0 30px -8px rgba(255,77,109,.45),var(--shadow)}
.glow-good{box-shadow:inset 0 0 0 1px rgba(36,227,161,.3),0 0 30px -10px rgba(36,227,161,.35),var(--shadow)}
.legend{display:flex;gap:.8rem;font-size:.7rem;color:var(--tx3);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:.6rem;height:.6rem;border-radius:3px;margin-right:.3rem;vertical-align:-1px}
.legend .ln{display:inline-block;width:1rem;height:0;border-top:2px dashed var(--thr);margin-right:.3rem;vertical-align:3px}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--tx3);font-size:.85rem;padding:1rem}
.empty b{display:block;color:var(--tx2);font-size:1rem;margin-bottom:.2rem}
/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.8rem}
.kpi{padding:.7rem .9rem;justify-content:space-between;gap:.25rem}
.kpi .kl{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.kpi .kl svg{width:.95rem;height:.95rem;flex:none}
.kpi .kv{font-size:2.05rem;font-weight:700;line-height:1;color:var(--c,var(--tx));display:flex;align-items:baseline;gap:.35rem}
.kpi .kv small{font-size:.85rem;color:var(--tx3);font-weight:500}
.kpi .ks{font-size:.72rem;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kx{position:absolute;right:.7rem;top:50%;transform:translateY(-50%)}
.kpi.acc{background:linear-gradient(135deg,var(--cbg),transparent 70%),var(--panel)}
.ring{display:block}
.ring circle{fill:none}
.ring .rt{stroke:var(--track)}
.ring .rv{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--cbg))}
/* ---------- ranking ---------- */
.rk{display:flex;flex-direction:column;height:100%}
.rk-head,.rk-row{display:grid;grid-template-columns:1.1rem minmax(0,1.35fr) minmax(0,1.5fr) 6.4rem 5.4rem;align-items:center;gap:.7rem}
.rk-head{font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);padding:0 .4rem .3rem;border-bottom:1px solid var(--line)}
.rk-row{height:var(--rh,2.4rem);padding:0 .4rem;border-radius:10px;cursor:pointer;position:relative;transition:background .2s;animation:slidein .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*45ms + 120ms)}
.rk-row:hover{background:var(--panel2)}
.rk-row+.rk-row{border-top:1px solid var(--line)}
@keyframes slidein{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.rk-name{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.rk-name b{font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-name span{font-size:.68rem;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:.35rem;align-items:center}
.bar{position:relative;height:.7rem;border-radius:99px;background:var(--track)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cbg),var(--c));box-shadow:0 0 14px -2px var(--c);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar .thr{position:absolute;top:-.25rem;bottom:-.25rem;width:2px;border-radius:2px;background:var(--thr);opacity:.85}
.bar .val{position:absolute;top:50%;transform:translate(.45rem,-50%);font-size:.8rem;font-weight:700;color:var(--c);white-space:nowrap;transition:left 1.1s cubic-bezier(.2,.8,.2,1)}
.rk-d{display:flex;justify-content:flex-end}
.rk-more{margin-top:auto;padding:.35rem .4rem 0;font-size:.72rem;color:var(--tx3);display:flex;justify-content:space-between;align-items:center}
.lnk{color:var(--acc);font-weight:600;font-size:.74rem}
.lnk:hover{text-decoration:underline}
/* ---------- listas de movimento ---------- */
.mv{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;height:100%}
.mv-col h4{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;margin-bottom:.35rem;display:flex;align-items:center;gap:.35rem}
.mv-it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.1rem .5rem;padding:.32rem .45rem;border-radius:9px;cursor:pointer;border-left:2px solid var(--c);background:linear-gradient(90deg,var(--cbg),transparent 85%);margin-bottom:.32rem;animation:slidein .5s both;animation-delay:calc(var(--k,0)*60ms + 200ms)}
.mv-it:hover{filter:brightness(1.15)}
.mv-it b{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-it span{font-size:.68rem;color:var(--tx3);white-space:nowrap}
.mv-it .chip{grid-row:1/3;grid-column:2;align-self:center}
/* ---------- versus ---------- */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem;height:100%}
.vs-side{text-align:center;padding:.3rem;border-radius:12px}
.vs-side .tl{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--c)}
.vs-side .big{font-size:1.75rem;font-weight:700;line-height:1.1;color:var(--tx)}
.vs-side .sm{font-size:.7rem;color:var(--tx3)}
.vs-mid{font-size:.75rem;font-weight:800;color:var(--tx3);letter-spacing:.1em}
.split{height:.5rem;border-radius:99px;overflow:hidden;display:flex;background:var(--track)}
.split i{display:block;height:100%;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
/* ---------- cartões (resumo) ---------- */
.cards{display:grid;gap:.6rem;height:100%}
.card{position:relative;border-radius:14px;padding:calc(.55rem*var(--cs,1)) calc(.75rem*var(--cs,1));background:linear-gradient(140deg,var(--cbg),transparent 55%),var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;min-height:0;min-width:0;overflow:hidden;cursor:pointer;animation:pop .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*40ms);transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--line2)}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.card .ch{display:flex;align-items:flex-start;gap:.45rem;min-width:0}
.card .ch .dot{margin-top:.28em}
.card .cn{font-size:calc(.8rem*var(--cs,1));font-weight:650;line-height:1.2;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cn small{font-weight:500;color:var(--tx3)}
.card .cm{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;min-width:0}
.card .cv{font-size:calc(1.75rem*var(--cs,1));font-weight:750;color:var(--c);line-height:1}
.card .cc{font-size:calc(.7rem*var(--cs,1));color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .cw{display:flex;gap:.25rem;flex-wrap:nowrap;min-width:0;overflow:hidden}
.card .cw span{font-size:calc(.64rem*var(--cs,1));padding:.08rem .32rem;border-radius:5px;background:var(--track);color:var(--tx2);white-space:nowrap}
.card .cw span.hot{background:var(--hb);color:var(--hc)}
.card .cw span.cur{outline:1px solid var(--c)}
.card .cx{font-size:calc(.62rem*var(--cs,1));color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cbadge{position:absolute;right:.55rem;bottom:.5rem}
.card.info{cursor:default;background:var(--panel2);border-style:dashed}
.card.info:before{background:var(--acc);box-shadow:none;opacity:.6}
.card.info .il{display:flex;justify-content:space-between;gap:.5rem;font-size:calc(.72rem*var(--cs,1));color:var(--tx2);padding:.12rem 0;border-bottom:1px solid var(--line)}
.card.info .il b{color:var(--tx)}
.card.info h6{font-size:calc(.66rem*var(--cs,1));letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin-bottom:.2rem}
/* ---------- raio-x ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.9fr);gap:.8rem}
.hero-id{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem 1rem;align-items:center}
.hero-id h2{font-size:1.35rem;font-weight:700;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-id .tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem}
.hero-v{grid-row:1/3;grid-column:2;text-align:right}
.hero-v .big{font-size:2.9rem;font-weight:750;line-height:1;color:var(--c);text-shadow:0 0 30px var(--cbg)}
.hero-v .lb{font-size:.72rem;color:var(--tx2);margin-top:.2rem}
.hero-id .meta{grid-column:1/3;font-size:.72rem;color:var(--tx3)}
.bullet{grid-column:1/3;position:relative;height:.55rem;border-radius:99px;background:var(--track);margin-top:1.05rem}
.bullet .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--cbg),var(--c));width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bullet .thr{position:absolute;top:-.3rem;bottom:-.3rem;width:2px;background:var(--thr)}
.bullet .tl{position:absolute;top:-1.15rem;transform:translateX(-50%);font-size:.6rem;color:var(--thr);font-weight:700}
.cmp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.55rem;height:100%}
.cmp-t{border-radius:12px;padding:.55rem .65rem;background:linear-gradient(160deg,var(--cbg),transparent 70%),var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;min-width:0;animation:pop .6s both;animation-delay:calc(var(--k,0)*55ms + 150ms)}
.cmp-t .tl{font-size:.6rem;letter-spacing:.03em;text-transform:uppercase;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-t .tv{font-size:1.25rem;font-weight:700;line-height:1.1}
.cmp-t .tr{font-size:.68rem;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-t .arrow{font-size:.78rem;font-weight:700;color:var(--c);white-space:nowrap}
/* ---------- gráficos ---------- */
.chart{display:block;overflow:visible}
.chart text{fill:var(--tx3);font-size:calc(10.5px * var(--ck,1));font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .thr{stroke:var(--thr);stroke-width:1.4;stroke-dasharray:5 4;opacity:.9}
.chart .thrl{fill:var(--thr);font-weight:700;font-size:calc(10px * var(--ck,1))}
.chart .ln{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{stroke-width:2;transition:r .2s}
.chart .vl{font-weight:700;font-size:calc(10.5px * var(--ck,1))}
.chart .xl{font-size:calc(10px * var(--ck,1))}
.chart .xl.hi{fill:var(--tx);font-weight:700}
.chart .band{fill:var(--accbg)}
.chart .hov{fill:transparent;cursor:pointer}
.chart .hov:hover{fill:rgba(150,172,222,.06)}
.chart .cross{stroke:var(--line2);stroke-dasharray:3 3}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:growY .9s cubic-bezier(.2,.8,.2,1) both}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growX .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{animation:draw 1.4s cubic-bezier(.4,.1,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.fadein{animation:fadein .8s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* ---------- heatmap ---------- */
.hm{display:grid;gap:3px;height:100%;font-size:.7rem}
.hm .hl{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;padding-right:.4rem;cursor:pointer;min-width:0}
.hm .hl:hover{color:var(--tx)}
.hm .hh{color:var(--tx3);font-size:.64rem;text-align:center;align-self:end;white-space:nowrap;overflow:hidden;letter-spacing:.02em}
.hm .hh.sel{color:var(--tx);font-weight:700}
.hm .hc{border-radius:5px;display:grid;place-items:center;font-weight:600;font-size:.66rem;cursor:pointer;transition:transform .15s,box-shadow .15s;animation:fadein .6s both;animation-delay:calc(var(--k,0)*6ms);min-width:0;overflow:hidden}
.hm .hc:hover{transform:scale(1.08);box-shadow:0 0 0 2px var(--tx);z-index:2;position:relative}
.hm .hc.na{background:transparent!important;border:1px dashed var(--line)}
.hm .hc.sel{box-shadow:0 0 0 2px var(--acc)}
/* ---------- dumbbell / divergente ---------- */
.db{display:flex;flex-direction:column;height:100%}
.db-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 5.6rem;align-items:center;gap:.7rem;height:var(--rh,2.2rem);padding:0 .3rem;border-radius:9px;cursor:pointer;animation:slidein .6s both;animation-delay:calc(var(--k,0)*40ms + 100ms)}
.db-row:hover{background:var(--panel2)}
.db-row+.db-row{border-top:1px solid var(--line)}
.db-track{position:relative;height:100%}
.db-track .axis{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.db-track .thr{position:absolute;top:22%;bottom:22%;width:2px;background:var(--thr);opacity:.6}
.db-track .seg{position:absolute;top:50%;height:4px;margin-top:-2px;border-radius:4px;border:0;padding:0;display:block;background:linear-gradient(90deg,var(--ca),var(--cb));opacity:.75;transition:left 1s cubic-bezier(.2,.8,.2,1),width 1s cubic-bezier(.2,.8,.2,1)}
.db-track .p{position:absolute;top:50%;width:.8rem;height:.8rem;margin:-.4rem 0 0 -.4rem;border-radius:50%;border:2px solid var(--bg0);transition:left 1s cubic-bezier(.2,.8,.2,1)}
.db-track .p.w{box-shadow:0 0 0 3px var(--cbg),0 0 12px var(--c)}
.db-track .pv{position:absolute;top:50%;font-size:.66rem;font-weight:700;white-space:nowrap;transition:left 1s cubic-bezier(.2,.8,.2,1)}
.dv-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.7fr) 6.2rem;align-items:center;gap:.7rem;height:var(--rh,2.2rem);padding:0 .3rem;border-radius:9px;cursor:pointer;animation:slidein .6s both;animation-delay:calc(var(--k,0)*40ms + 100ms)}
.dv-row:hover{background:var(--panel2)}
.dv-row+.dv-row{border-top:1px solid var(--line)}
.dv-track{position:relative;height:62%}
.dv-track .mid{position:absolute;left:50%;top:-15%;bottom:-15%;width:1px;background:var(--line2)}
.dv-track .b{position:absolute;top:18%;bottom:18%;border-radius:5px;background:var(--c);box-shadow:0 0 12px -3px var(--c);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.dv-track .b.l{right:50%}.dv-track .b.r{left:50%}
.dv-track .bl{position:absolute;top:50%;transform:translateY(-50%);font-size:.66rem;font-weight:700;color:var(--c);white-space:nowrap}
.cmpv{font-size:.7rem;color:var(--tx2);text-align:right;white-space:nowrap}
.cmpv b{color:var(--tx);font-weight:650}
/* ---------- semana × semana ---------- */
.ww-row{display:grid;grid-template-columns:minmax(0,1.3fr) 4.3rem 1.9rem 4.3rem 5.6rem;align-items:center;gap:.5rem;height:var(--rh,2.2rem);padding:0 .35rem;border-radius:9px;cursor:pointer;animation:slidein .6s both;animation-delay:calc(var(--k,0)*40ms + 100ms)}
.ww-row:hover{background:var(--panel2)}
.ww-row+.ww-row{border-top:1px solid var(--line)}
.ww-v{font-size:.82rem;font-weight:700;text-align:right}
.ww-v.b{color:var(--tx3);font-weight:600}
.ww-head{display:grid;grid-template-columns:minmax(0,1.3fr) 4.3rem 1.9rem 4.3rem 5.6rem;gap:.5rem;padding:0 .35rem .3rem;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);border-bottom:1px solid var(--line)}
.ww-head span{text-align:right}
.slope{width:100%;height:1.4rem}
/* ---------- calendário ---------- */
.cal{display:grid;gap:.7rem;height:100%}
.cal-m{display:flex;flex-direction:column;min-height:0;min-width:0;animation:pop .6s both;animation-delay:calc(var(--k,0)*35ms)}
.cal-m h5{font-size:.72rem;font-weight:650;color:var(--tx2);margin-bottom:.25rem;text-transform:capitalize;display:flex;justify-content:space-between}
.cal-m h5 span{color:var(--tx3);font-weight:500;text-transform:none}
.cal-g{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:2px;min-height:0}
.cal-g .cd{border-radius:4px;display:grid;place-items:center;font-size:.58rem;color:var(--tx3);background:var(--track);opacity:.35;min-height:0}
.cal-g .cd.on{opacity:1;cursor:pointer;color:rgba(0,0,0,.65);font-weight:700;transition:transform .15s}
.cal-g .cd.on:hover{transform:scale(1.25);z-index:2;box-shadow:0 0 0 2px var(--tx)}
.cal-g .cd.sel{box-shadow:0 0 0 2px var(--acc);z-index:1}
.cal-g .cd.x{visibility:hidden}
.cal-g .wd{font-size:.52rem;color:var(--tx3);text-align:center;align-self:end}
.scale{display:flex;align-items:center;gap:.4rem;font-size:.66rem;color:var(--tx3)}
.scale i{display:block;height:.5rem;flex:1;border-radius:99px}
.stat{display:flex;flex-direction:column;gap:.15rem;padding:.55rem .65rem;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}
.stat .sl{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3)}
.stat .sv{font-size:1.15rem;font-weight:700}
.stat .ss{font-size:.68rem;color:var(--tx2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
/* ---------- controles locais ---------- */
select.sel{height:1.9rem;border-radius:9px;border:1px solid var(--line);background:var(--panel2);padding:0 .5rem;font-size:.76rem;outline:none;max-width:12rem}
select.sel option{background:var(--bg1);color:var(--tx)}
.btn{display:inline-flex;align-items:center;gap:.4rem;height:2rem;padding:0 .8rem;border-radius:9px;border:1px solid var(--line2);font-size:.78rem;font-weight:600;color:var(--tx);background:var(--panel2);transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--acc);background:var(--accbg)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#061020}
.btn.pri:hover{filter:brightness(1.1)}
.btn svg{width:.95rem;height:.95rem}
.vs-lbl{font-size:.7rem;color:var(--tx3);font-weight:700}
/* ---------- popovers / drawer / tooltip / toast ---------- */
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--tipbg);border:1px solid var(--line2);border-radius:11px;padding:.5rem .7rem;font-size:.76rem;color:var(--tx);box-shadow:0 16px 40px -12px rgba(0,0,0,.55);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;max-width:20rem}
#tip.on{opacity:1;transform:none}
#tip .tt{font-weight:700;margin-bottom:.2rem}
#tip .tr{display:flex;gap:.6rem;justify-content:space-between;white-space:nowrap}
#tip .tr i{display:inline-block;width:.55rem;height:.55rem;border-radius:2px;margin-right:.35rem}
#tip .mut{color:var(--tx3);font-size:.7rem}
.pop{position:fixed;z-index:150;background:var(--panelS);border:1px solid var(--line2);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);padding:.9rem;animation:popin .22s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(18px)}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;z-index:140}
.dp{width:19rem}
.dp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.dp-h b{font-size:.9rem;text-transform:capitalize}
.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dp-g .w{font-size:.62rem;color:var(--tx3);text-align:center;padding-bottom:.2rem}
.dp-g button{height:2.1rem;border-radius:8px;font-size:.78rem;font-weight:600;color:var(--tx3);position:relative;opacity:.4;cursor:default}
.dp-g button.on{opacity:1;cursor:pointer;color:var(--tx)}
.dp-g button.on:hover{box-shadow:0 0 0 2px var(--line2)}
.dp-g button.sel{box-shadow:0 0 0 2px var(--acc)!important}
.dp-g button i{position:absolute;left:50%;bottom:.22rem;transform:translateX(-50%);font-style:normal;font-size:.55rem;font-weight:700;padding:0 .25rem;border-radius:4px;line-height:1.2}
.dp-f{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem;font-size:.68rem;color:var(--tx3);gap:.5rem}
.setp{width:24rem;max-height:calc(100vh - 6rem);overflow:auto}
.setp h4{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin:.8rem 0 .4rem}
.setp h4:first-child{margin-top:0}
.setp p{font-size:.74rem;color:var(--tx2);line-height:1.45}
.setp .row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.setp input[type=text]{flex:1;height:2rem;border-radius:9px;border:1px solid var(--line);background:var(--panel2);padding:0 .6rem;font-size:.78rem;outline:none}
.tgl{display:flex;align-items:center;gap:.6rem;font-size:.78rem;cursor:pointer;user-select:none}
.tgl i{width:2.2rem;height:1.25rem;border-radius:99px;background:var(--track);border:1px solid var(--line2);position:relative;transition:.25s;flex:none}
.tgl i:after{content:"";position:absolute;top:2px;left:2px;width:.85rem;height:.85rem;border-radius:50%;background:var(--tx3);transition:.25s}
.tgl.on i{background:var(--accbg);border-color:var(--acc)}
.tgl.on i:after{left:calc(100% - .85rem - 2px);background:var(--acc)}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;font-size:.74rem}
.kv2 span{color:var(--tx3)}
.drawer{position:fixed;z-index:150;top:0;right:0;bottom:0;width:min(34rem,92vw);background:var(--panelS);border-left:1px solid var(--line2);box-shadow:-30px 0 60px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;animation:slideL .35s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(18px)}
@keyframes slideL{from{transform:translateX(100%)}to{transform:none}}
.drawer-h{display:flex;align-items:center;gap:.6rem;padding:1rem 1.1rem;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:1rem}
.drawer-b{flex:1;overflow:auto;padding:1rem 1.1rem;scrollbar-width:thin}
.wa{white-space:pre-wrap;font-family:var(--font);font-size:.82rem;line-height:1.5;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem}
.out-l{font-size:.76rem;color:var(--tx2);line-height:1.6}
.out-l li{margin-left:1rem}
#toast{position:fixed;z-index:180;right:1.2rem;bottom:1.2rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-end}
.toast{display:flex;gap:.7rem;align-items:center;max-width:26rem;padding:.75rem 1rem;border-radius:14px;background:var(--panelS);border:1px solid var(--line2);box-shadow:0 20px 50px -15px rgba(0,0,0,.6);font-size:.8rem;animation:toastin .5s cubic-bezier(.2,.8,.2,1) both}
.toast.out{animation:toastout .4s ease both}
.toast .ti{width:2rem;height:2rem;border-radius:10px;display:grid;place-items:center;background:var(--goodbg);color:var(--good);flex:none}
.toast b{display:block;font-size:.84rem}
.toast span{color:var(--tx2);font-size:.74rem}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateX(30px)}}
.sweep{position:fixed;inset:0;z-index:120;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(90,209,255,.10) 50%,transparent 70%);animation:sweep 1.4s ease-out both}
