<script>
/* =====================================================================
   MOTOR DE CÁLCULO — Desvios T1/T2 (compartilhado: Dashboard e Ponte)
   Regras: % = soma(NC) / soma(AM) x 100 por item (setor + item de controle
   + parâmetro); 1 casa decimal com arredondamento half-up; corte >= 10,0%;
   exclusões de máquina/processo; evisceradora = 100 - ineficiência.
   ===================================================================== */
var ENG = (function () {
  'use strict';
  var DOW = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var DOWF = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  var MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var MESF = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var SETOR_ORDER = ['plataforma', 'escaldagem', 'evisceracao', 'miudos', 'cortes 1', 'cortes 2', 'embalagem secundaria', 'paletizacao'];

  /* ---------------- texto ---------------- */
  function clean(s) { return (s == null ? '' : String(s)).replace(/\s+/g, ' ').trim(); }
  function fold(s) { return clean(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function paramKey(p) {
    var k = fold(p).replace(/[\s.;:,]+$/, '');
    k = k.replace(/\bexcessos\b/g, 'excesso')
      .replace(/\bcaracteristic(o|os|as)\b/g, 'caracteristica')
      .replace(/\s*\(\s*/g, ' (').replace(/\s*\)/g, ')')
      .replace(/\s*\/\s*/g, '/')
      .replace(/\s+/g, ' ').trim();
    return k;
  }
  function sentence(s) {
    s = clean(s);
    var w = s.split(' ');
    for (var i = 1; i < w.length; i++) {
      var x = w[i];
      var up = (x.match(/[A-ZÁÉÍÓÚÂÊÔÃÕÇ]/g) || []).length;
      if (up === 1 && /^[A-ZÁÉÍÓÚÂÊÔÃÕÇ]/.test(x) && x.length > 1) w[i] = x.charAt(0).toLowerCase() + x.slice(1);
    }
    s = w.join(' ');
    if (/^Í/.test(s)) s = 'I' + s.slice(1);
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  /* ---------------- rótulos ---------------- */
  var IC_MAP = [
    [/qualidade do peito/, 'Peito', 'no peito'], [/qualidade da asa/, 'Asa', 'na asa'], [/qualidade da perna/, 'Perna', 'na perna'],
    [/qualidade do sassami/, 'Sassami', 'no sassami'], [/qualidade dos pes/, 'Pés', 'nos pés'], [/qualidade de moela/, 'Moela', 'na moela'],
    [/qualidade do figado/, 'Fígado', 'no fígado'], [/qualidade de coracao/, 'Coração', 'no coração'], [/temperados/, 'Temperados', 'nos temperados'],
    [/norea/, 'Nórea (desossa)', ''], [/penas e cuticulas/, 'Penas, cutículas e fraturas', ''], [/agua de escaldagem/, 'Escaldagem e depenagem', ''],
    [/extratora de cloaca/, 'Extratora, abridora e evisceradora', ''], [/transferidor/, 'Transferidor e corte do pé', ''],
    [/encaixotar/, 'Encaixotamento', ''], [/montagem de caixas/, 'Montagem de caixas', ''], [/paletizar/, 'Paletização', ''],
    [/strechar/, 'Strech de paletes', ''], [/plastificar/, 'Plastificação', ''], [/perda de miudos/, 'Perda de miúdos', ''],
    [/bandeja ulma|ulma/, 'Embaladora Ulma', ''], [/embaladoras/, 'Embaladoras', '']
  ];
  function icInfo(ic) {
    var f = fold(ic);
    for (var i = 0; i < IC_MAP.length; i++) if (IC_MAP[i][0].test(f)) return { short: IC_MAP[i][1], prep: IC_MAP[i][2] };
    var s = clean(ic).replace(/^(padr[aã]o de qualidade|par[aâ]metros?)\s+(d[aoe]s?\s+)?/i, '');
    return { short: s ? sentence(s) : (clean(ic) || '—'), prep: '' };
  }
  function setorTag(setor) {
    var f = fold(setor);
    if (/^cortes 1$/.test(f)) return 'cortes';
    if (/^cortes/.test(f)) return f;
    if (/embalagem/.test(f)) return 'embalagem';
    return clean(setor).toLowerCase();
  }

  /* ---------------- exclusões (método, item 5) ---------------- */
  var EXCL = [
    [/temperatura|forno/, 'Temperatura / forno'],
    [/velocidade/, 'Velocidade de linha ou máquina'],
    [/seladora|solda|selagem|tunel|encolhimento|^pressao|^tempo /, 'Parâmetro de máquina (seladora / embaladora)'],
    [/embaladora|bobina|corte de separacao da embalagem/, 'Máquina embaladora'],
    [/manopla|\bagua\b/, 'Água / vapor da escaldagem'],
    [/dedos/, 'Dedos da depenadeira / depilador'],
    [/descarte/, 'Descarte (etiquetas, strech, embalagens)'],
    [/perda de fundo/, 'Perda de fundo de caixa'],
    [/checadora/, 'Checadora de peso (máquina)'],
    [/eficiencia/, 'Eficiência de máquina (só a evisceradora entra)']
  ];
  function exclusion(pf) {
    if (/ineficiencia evisceradora/.test(pf)) return null;
    for (var i = 0; i < EXCL.length; i++) if (EXCL[i][0].test(pf)) return EXCL[i][1];
    return null;
  }

  /* ---------------- números ---------------- */
  function r1pct(nc, am) { return am > 0 ? Math.floor(nc * 1000 / am + 0.5 + 1e-9) / 10 : null; }
  function r1(x) { return x == null ? null : Math.floor(x * 10 + 0.5 + 1e-7) / 10; }
  function dlt(a, b) { return Math.round((a - b) * 10) / 10; }
  function f1(x) { return x == null || isNaN(x) ? '—' : (Math.round(x * 10) / 10).toFixed(1).replace('.', ','); }
  function fp(x) { return x == null ? '—' : f1(x) + '%'; }
  function fpp(d, ascii) { if (d == null) return '—'; var s = d > 0 ? '+' : d < 0 ? (ascii ? '-' : '−') : '±'; return s + f1(Math.abs(d)) + ' p.p.'; }
  function fint(n) { return n == null ? '—' : Math.round(n).toLocaleString('pt-BR'); }

  /* ---------------- datas ---------------- */
  function isoToUTC(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function utcToIso(t) { var d = new Date(t); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
  function dow(iso) { return new Date(isoToUTC(iso)).getUTCDay(); }
  function mondayOf(iso) { var t = isoToUTC(iso), w = (new Date(t).getUTCDay() + 6) % 7; return utcToIso(t - w * 864e5); }
  function addDays(iso, n) { return utcToIso(isoToUTC(iso) + n * 864e5); }
  function dm(iso) { var p = iso.split('-'); return p[2] + '/' + p[1]; }
  function dmy(iso, short) { var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + (short ? p[0].slice(2) : p[0]); }

  /* ---------------- margem de erro e força da diferença ---------------- */
  /* intervalo de Wilson (95%) para a proporção nc/am, em % */
  function wilson(nc, am) {
    if (!(am > 0)) return null;
    var z = 1.96, p = nc / am, z2 = z * z, den = 1 + z2 / am, c = (p + z2 / (2 * am)) / den, h = z * Math.sqrt(p * (1 - p) / am + z2 / (4 * am * am)) / den;
    return [Math.max(0, (c - h) * 100), Math.min(100, (c + h) * 100)];
  }
  /* teste de duas proporções (aproximação normal); devolve p (bilateral) */
  function ptest(nc1, am1, nc2, am2) {
    if (!(am1 > 0) || !(am2 > 0)) return null;
    var p1 = nc1 / am1, p2 = nc2 / am2, p = (nc1 + nc2) / (am1 + am2), se = Math.sqrt(p * (1 - p) * (1 / am1 + 1 / am2));
    if (!(se > 0)) return p1 === p2 ? 1 : 0;
    var z = Math.abs(p1 - p2) / se; return 2 * (1 - INTEL.normCdf(z));
  }
  /* força da diferença entre duas referências do dossiê:
     dia × dia → teste das duas proporções (amostras do turno);
     período × período (3+ dias cada) → teste de Welch nos valores diários (considera a variação natural entre dias);
     dia × período (5+ dias) → quão fora do normal diário do período está o dia */
  function evidP(it, A, B, a, b) {
    var dd = function (R) { var ts = tsOf(R.t); return DS.prodDays(R.d0, R.d1, ts).map(function (x) { var s = DS.sum(it.id, x, x, ts); return s[0] > 0 ? s[1] / s[0] * 100 : null; }).filter(function (v) { return v != null; }); };
    var va = dd(A), vb = dd(B);
    if (va.length >= 3 && vb.length >= 3) return INTEL.welch(va, vb).p;
    var one = va.length === 1 ? va : vb.length === 1 ? vb : null, many = va.length === 1 ? vb : va;
    if (one && many.length >= 5) {
      var m = INTEL.mean(many), sd = Math.sqrt(many.reduce(function (s, v) { return s + (v - m) * (v - m); }, 0) / (many.length - 1));
      if (!(sd > 0)) return one[0] === m ? 1 : 0;
      return 2 * (1 - INTEL.normCdf(Math.abs(one[0] - m) / sd));
    }
    return ptest(a.nc, a.am, b.nc, b.am);
  }
  function evidTxt(p) {

    if (p < 0.05) return { cls: 'mid', t: 'diferença provavelmente real' };
    return { cls: 'weak', t: 'pode ser só variação da amostra' };
  }

  function margemTxt(it, am, nc) {

    if (announce && (news.length || fixed.length)) {
      var dl = function (x) { var k = x.split('|'); return 'T' + k[1] + ' ' + E.dlabelLong(k[0]); };
      if (news.length) toast('Dados atualizados da planilha', news.length + ' dia(s)/turno(s) novo(s) · último: ' + dl(news[news.length - 1]) + ' (' + after[news[news.length - 1]] + ' linhas)', 'bolt');
      if (fixed.length) toast('Correção aplicada', fixed.slice(-3).map(dl).join(', ') + (fixed.length > 3 ? ' e mais ' + (fixed.length - 3) : '') + ' · vale o lançamento mais recente', 'check');
      var sw = document.createElement('div'); sw.className = 'sweep'; document.body.appendChild(sw); setTimeout(function () { sw.remove(); }, 1500);
    }
  }
  function keyCounts(ds) { var o = {}; for (var d = 0; d < ds.nD; d++) for (var t = 0; t < 2; t++) if (ds.rowsDT[t][d]) o[ds.dates[d] + '|' + (t + 1)] = ds.rowsDT[t][d]; return o; }
  function boot() {
    gate('loading');
    IDB.get('ultima').then(function (c) {
      if (c && c.tabs && c.tabs.base && (!c.conector || !Source.conector() || c.conector === Source.conector())) {
        OV.tabs = c.tabs; OV.at = c.at; OV.from = 'cache'; OV.nome = c.nome; OV.fp = c.fp; Source.sig = c.sig || ''; Source.state = 'cache';
        apply(false);
      }
    }).catch(function () { }).then(function () {
      if (!Source.has()) { if (!DS || !DS.nD) gate('setup'); return; }
      refresh(true);
    });
    setInterval(function () { if (Source.has()) Source.check(); }, (CFG.atualizarMinutos || 3) * 60000);
    window.addEventListener('focus', function () { if (Source.has() && Date.now() - Source.lastTry > 60000) Source.check(); });
  }

  /* ======================= MODO TV ======================= */
  var TV = { timer: null, step: 0, dur: 15000 };
  function tvSteps() {
    var day = DS.day(S.d, TS(), OPT()), top = day.rows.filter(function (r) { return qual(r.it) && r.hit; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 3);
    var st = [['panorama'], ['resumo']];
    top.forEach(function (r) { st.push(['raiox', r.i]); });
    return st.concat([['prior'], ['sentinela'], ['viradas'], ['persist'], ['familias'], ['corrida'], ['proj'], ['turno'], ['semana'], ['mes'], ['lab', top[0] ? top[0].i : null], ['calendario']]);
  }
  function tvToggle() {
    S.tv = !S.tv; $('#b-tv').classList.toggle('on', S.tv);
    if (TV.timer) { clearInterval(TV.timer); TV.timer = null; }
    var bar = $('.tvbar'); if (bar) bar.remove();
    if (!S.tv) { toast('Modo TV desligado', 'Navegação manual.', 'tv'); return; }
    toast('Modo TV ligado', 'As telas giram sozinhas a cada 15 s. Esc para sair.', 'tv');
    TV.step = 0; tvGo();
    TV.timer = setInterval(tvGo, TV.dur);
  }
  function tvGo() {
    var st = tvSteps(), s = st[TV.step % st.length]; TV.step++;
    S.view = s[0]; if (s[1] != null) S.item = s[1];
    if (s[0] === 'calendario') S.calm = 'geral';
    render();
    var bar = document.createElement('div'); bar.className = 'tvbar'; bar.style.width = '0'; $('#main').appendChild(bar);
    requestAnimationFrame(function () { bar.style.transition = 'width ' + TV.dur + 'ms linear'; bar.style.width = '100%'; });
  }

  /* ======================= ESQUELETO ======================= */
  var BNAV = [['panorama', 'panorama', 'Panorama'], ['resumo', 'resumo', 'Desvios'], ['viradas', 'steps', 'Viradas'], ['proj', 'proj', 'Previsão'], ['menu', 'grid', 'Menu']];
  function shell() {
    detectLayout();
    S.collapsed = load(colKey(), colDefault());
    var nav = VIEWS.map(function (v) { return (v.grp ? '<div class="navlbl nav-grp">' + v.grp + '</div>' : '') + '<button data-view="' + v.id + '" title="' + v.name + (v.key ? ' (' + v.key + ')' : '') + '">' + I(v.icon) + '<span>' + v.name + '</span>' + (v.key ? '<em class="k">' + v.key + '</em>' : v.nw ? '<em class="k nw">novo</em>' : '') + '</button>'; }).join('');
    document.getElementById('app').innerHTML =
      '<aside id="side"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="lgx" x1="0" x2="1"><stop offset="0" stop-color="#5ad1ff"/><stop offset="1" stop-color="#24e3a1"/></linearGradient></defs><path d="M2 13h4l2.5-6 4 11 2.5-6H22" stroke="url(#lgx)"/></svg></div><div class="brand-t"><b>Radar de Desvios</b><span>Excelência Operacional</span></div><button class="collapse-btn" id="b-col" title="Recolher / expandir menu">' + I('dchev') + '</button><button class="ib mclose" id="b-mclose" title="Fechar menu">' + I('close') + '</button></div>' +
      '<div class="navsec"><div class="navlbl">Visões</div><nav class="nav" id="nav">' + nav + '</nav></div>' +
      '<div class="navsec tree-btn"><nav class="nav"><button id="b-find" title="Anomalias (abrir menu)">' + I('search') + '</button></nav></div>' +
      '<div class="side-tree"><div class="navlbl" style="padding-top:.6rem">Anomalias <span style="letter-spacing:0;text-transform:none">valor no dia ' + infoBtn('g-tree') + '</span></div><div class="srch">' + I('search') + '<input id="q" placeholder="Buscar: peito queimado, pena na asa…" autocomplete="off"></div><div class="tree" id="tree"></div></div>' +
      '<div class="deck" id="deck"></div><button class="deck-pill" id="deck-pill" title="Insights do Radar"></button>' +
      '<div class="mfoot"><button class="live" id="live2"></button><div class="mf-b"><button class="btn" id="m-set">' + I('sliders') + ' Ajustes</button><button class="btn" id="m-theme">' + I(S.theme === 'light' ? 'moon' : 'sun') + ' Tema</button><button class="btn" id="m-full">' + I('full') + ' Tela cheia</button></div></div></aside>' +
      '<div id="menu-scrim" class="mscrim"></div>' +
      '<header id="top"><button class="ib mob" id="b-menu" title="Menu">' + I('menu') + '</button><button class="backbtn wide-only" id="b-back"></button><div class="ttl" id="ttl"></div>' +
      '<div class="datenav"><button class="ib" id="dprev" title="Dia anterior (←)">' + I('chevL') + '</button><button class="datebtn" id="dlbl" title="Escolher data"></button><button class="ib" id="dnext" title="Próximo dia (→)">' + I('chevR') + '</button></div>' +
      '<div class="seg" id="turno"><button data-v="1">T1</button><button data-v="2">T2</button><button data-v="A"><span class="wide-only">T1+T2</span><span class="mob">1+2</span></button><i class="pill"></i></div>' +
      '<div class="seg scope wide-only" id="scope" title="Filtro das listas"><button data-s="corte">≥ 10%</button><button data-s="todos">Todos</button><i class="pill"></i></div>' +
      '<button class="fltbtn wide-only" id="b-flt" title="Filtrar itens em todas as telas (I)"></button>' +
      '<button class="live" id="live"></button>' +
      '<div class="tools"><button class="ib presbtn" id="b-pres" title="Modo apresentação (P)">' + I('present') + '</button><button class="ib" id="b-tv" title="Modo TV (T)">' + I('tv') + '</button><button class="ib" id="b-theme" title="Tema claro/escuro">' + I(S.theme === 'light' ? 'moon' : 'sun') + '</button><button class="ib" id="b-full" title="Tela cheia (F)">' + I('full') + '</button><button class="ib" id="b-set" title="Ajustes e conexão com a planilha">' + I('sliders') + '</button></div></header>' +
      '<div id="subh"><button class="backbtn" id="b-back2"></button><button class="scopebtn" id="scope2" title="Alternar: só itens ≥ 10% ou todas as análises"></button><button class="fltbtn fb-m" id="b-flt2" title="Filtrar itens"></button><span id="warn2"></span><div id="pchips" class="pchipsw"></div><button class="ib presbtn" id="b-pres2" title="Modo apresentação">' + I('present') + '</button></div>' +
      '<main id="main"></main><div id="fbar" class="fbar"></div>' +
      '<nav id="bnav">' + BNAV.map(function (b) { return '<button data-bn="' + b[0] + '" class="' + (b[0] === 'proj' ? 'bn-ask' : '') + '">' + I(b[1]) + '<span>' + b[2] + '</span></button>'; }).join('') + '</nav>';
    main = $('#main');
    $('#app').classList.toggle('collapsed', !!S.collapsed);
    $$('#nav button').forEach(function (b) { b.onclick = function () { navFromMenu({ view: b.getAttribute('data-view'), focus: null, ov: null }); }; });
    $('#b-col').onclick = function () { S.collapsed = !S.collapsed; store(colKey(), S.collapsed); $('#app').classList.toggle('collapsed', S.collapsed); setTimeout(function () { render(false); }, 470); };
    $('#b-find').onclick = function () { S.collapsed = false; store(colKey(), false); $('#app').classList.remove('collapsed'); setTimeout(function () { render(false); $('#q').focus(); }, 470); };
    $('#b-menu').onclick = function () { if (S.ov && S.ov.t === 'menu') closeOv(); else openOv({ t: 'menu' }); };
    $('#b-mclose').onclick = function () { closeOv(); };
    $('#menu-scrim').onclick = function () { closeOv(); };
    $('#dprev').onclick = function () { var p = DS.prevDay(S.d, TS(), false); setDate(p >= 0 ? p : S.d - 1); };
    $('#dnext').onclick = function () { var n = DS.nextDay(S.d, TS()); setDate(n >= 0 ? n : S.d + 1); };
    $('#dlbl').onclick = openDatePicker;
    $$('#turno button').forEach(function (b) { b.onclick = function () { S.turno = b.getAttribute('data-v'); render(); }; });
    $$('#scope button').forEach(function (b) { b.onclick = function () { setScope(b.getAttribute('data-s')); }; });
    $('#scope2').onclick = function () { setScope(S.scope === 'todos' ? 'corte' : 'todos'); };
    $('#b-flt').onclick = function () { openFilter(); }; $('#b-flt2').onclick = function () { openFilter(); };
    $('#fbar').addEventListener('click', fbarClick);
    $('#live').onclick = openSettings; $('#live2').onclick = function () { closeOv(); setTimeout(openSettings, 320); };
    $('#deck-pill').onclick = function () { S.collapsed = false; store(colKey(), false); $('#app').classList.remove('collapsed'); DECK.min = false; store('deckmin', false); setTimeout(function () { render(false); deckRender(true); }, 470); };
    $('#b-set').onclick = openSettings; $('#m-set').onclick = function () { closeOv(); setTimeout(openSettings, 320); };
    $('#b-tv').onclick = tvToggle;
    var thm = function () { setTheme(S.theme === 'light' ? 'dark' : 'light'); $('#b-theme').innerHTML = I(S.theme === 'light' ? 'moon' : 'sun'); $('#m-theme').innerHTML = I(S.theme === 'light' ? 'moon' : 'sun') + ' Tema'; };
    $('#b-theme').onclick = thm; $('#m-theme').onclick = thm;
    var fs = function () { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) { } };
    $('#b-full').onclick = fs; $('#m-full').onclick = fs;
    $('#b-pres').onclick = function () { presChooser(this); }; $('#b-pres2').onclick = function () { presChooser(this); };
    $$('#bnav button').forEach(function (b) {
      b.onclick = function () {
        var v = b.getAttribute('data-bn');
        if (v === 'menu') { if (S.ov && S.ov.t === 'menu') closeOv(); else openOv({ t: 'menu' }); return; }
        if (S.view === v && !S.ov && !S.focus) return;
        navFromMenu({ view: v, focus: null, ov: null });
      };
    });
    var qt = null;
    $('#q').oninput = function () { var v = this.value; clearTimeout(qt); qt = setTimeout(function () { S.q = v; renderTree(); }, 120); };
    $('#q').onkeydown = function (e) { if (e.key === 'Enter') { var f = $('#tree .leaf'); if (f) f.click(); } };
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target : null; if (!el) return;
      var t;
      if ((t = el.closest('[data-info]'))) { e.preventDefault(); e.stopPropagation(); if (INFOB && INFOB.getAttribute('data-k') === t.getAttribute('data-info') && INFOPIN) infoHide(); else { infoShow(t, true); if (INFOB) INFOB.setAttribute('data-k', t.getAttribute('data-info')); } return; }
      if ((t = el.closest('[data-focus]'))) { focusPanel(t.getAttribute('data-focus'), t); return; }
      if ((t = el.closest('[data-pres]'))) { presStart({ from: t.getAttribute('data-pres') }, t); return; }
      if ((t = el.closest('.backbtn'))) { uiBack(); return; }
      if ((t = el.closest('[data-crumb]'))) { uiBack(+t.getAttribute('data-crumb')); return; }
      if ((t = el.closest('[data-item]')) && !el.closest('.pop') && !el.closest('#pres')) { openItem(+t.getAttribute('data-item'), t); return; }
      if ((t = el.closest('[data-day]')) && !el.closest('#pres')) { var dd = +t.getAttribute('data-day'), pv = {}; pv.d = dd; if (S.view === 'calendario' && !S.ov) pv.view = S.calm === 'item' ? 'raiox' : 'panorama'; navGo(pv); return; }
      if ((t = el.closest('[data-go-day]'))) { navGo({ d: +t.getAttribute('data-go-day') }); return; }
      if ((t = el.closest('[data-fopen]')) && !el.closest('#fltp')) { openFilter(t.getAttribute('data-fopen') || null); return; }
      if ((t = el.closest('[data-view]')) && !t.closest('#nav')) { navGo({ view: t.getAttribute('data-view'), ov: null, focus: null }); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (INFOB) { infoHide(true); return; }
        if ($('#popwrap')) { closePop(); return; }
        if (S.tv) { tvToggle(); return; }
        if (S.ov || NAV.length) { uiBack(); return; }
        return;
      }
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
      if (!DS || !DS.nD || $('#gate')) return;
      if (S.ov && S.ov.t === 'present') return;
      if (e.key === 'Backspace' && NAV.length) { e.preventDefault(); uiBack(); return; }
      if (e.key === 'ArrowLeft') $('#dprev').click();
      else if (e.key === 'ArrowRight') $('#dnext').click();
      else if (/^[0-9]$/.test(e.key)) { var vv = VIEWS.filter(function (x) { return x.key === e.key; })[0]; if (vv) navGo({ view: vv.id, ov: null, focus: null }); }
      else if (e.key === 't' || e.key === 'T') tvToggle();
      else if (e.key === 'p' || e.key === 'P') presStart({}, $('#b-pres'));
      else if (e.key === 'r' || e.key === 'R') presStart({ roteiro: 'dia' }, $('#b-pres'));
      else if (e.key === 'w' || e.key === 'W') presStart({ roteiro: 'semana' }, $('#b-pres'));
      else if (e.key === 'm' || e.key === 'M') presStart({ roteiro: 'mes' }, $('#b-pres'));
      else if (e.key === 'f' || e.key === 'F') $('#b-full').click();
      else if (e.key === 'i' || e.key === 'I') openFilter();
    });
    swipe(main, null, null, null);
    var rt = null, lastW = 0, lastH = 0;
    new ResizeObserver(function () { var w = main.clientWidth, h = main.clientHeight; if (Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return; lastW = w; lastH = h; clearTimeout(rt); rt = setTimeout(function () { if (DS && DS.nD) render(false); }, 160); }).observe(main);
    window.addEventListener('resize', function () { if (detectLayout()) { S.collapsed = load(colKey(), colDefault()); $('#app').classList.toggle('collapsed', !!S.collapsed); if (S.ov && S.ov.t === 'menu' && !LAY.narrow) closeOv(); } });
  }
  /* abre a análise de um item: no Raio-X / Laboratório / Sentinela / Viradas troca o item da tela; nas demais abre o dossiê */
  function openItem(i, el) {
    if (S.ov && S.ov.t === 'menu') { ORIGIN = null; navGo({ item: i, ov: { t: 'dossie', i: i, tab: 'hoje' } }, { replace: true }); return; }
    if (!S.ov) {
      if (S.view === 'lab') { navGo({ item: i, labx: null }); return; }
      if (S.view === 'viradas' && el && el.closest('#main')) { navGo({ vrSel: i, item: i }); return; }
      if (S.view === 'sentinela') { S.sentFollow = true; navGo({ item: i }); return; }
      if (S.view === 'raiox' && el && el.closest('#side')) { navGo({ item: i }); return; }
    }
    ORIGIN = rectOf(el);
    navGo({ item: i, ov: { t: 'dossie', i: i, tab: S.ov && S.ov.t === 'dossie' ? S.ov.tab : 'hoje' } });
  }

  /* ======================= INÍCIO ======================= */
  shell();
  boot();
  window.__DASH = { S: S, get DS() { return DS; }, render: render, Source: Source, OV: OV, refresh: refresh, gate: gate, navGo: navGo, openOv: openOv };
})();

</script>
