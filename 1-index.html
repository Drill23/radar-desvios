/* ---------- casca estreita: celular e tablet em pé ---------- */
[data-narrow] #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;--sw:0px}
[data-narrow] #side{position:fixed;z-index:95;top:0;bottom:0;left:0;width:min(88vw,23rem);transform:translateX(-104%);transition:transform .42s cubic-bezier(.2,.8,.2,1);box-shadow:30px 0 70px -20px rgba(0,0,0,.6);grid-row:auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overflow:hidden}
[data-narrow] #app.menu-open #side{transform:none}
[data-narrow] #side .collapse-btn{display:none}
[data-narrow] #side .mclose{display:grid;width:2.3rem;height:2.3rem;margin-left:auto}
[data-narrow] .collapsed .nav button span,[data-narrow] .collapsed .navlbl,[data-narrow] .collapsed .side-tree{display:revert}
[data-narrow] #side .side-tree{display:flex}
[data-narrow] #side .tree-btn,[data-narrow] #side .deck-pill{display:none}
[data-narrow] #side .deck{display:block}
[data-narrow] #side .nav button{padding:.55rem .65rem;font-size:.9rem}
[data-narrow] #side .mfoot{display:flex;flex-direction:column;gap:.5rem;padding:.6rem .7rem;border-top:1px solid var(--line);flex:none}
[data-narrow] #side .mfoot .live{display:flex;max-width:none;width:100%}
[data-narrow] #side .mf-b{display:flex;gap:.4rem;flex-wrap:wrap}
[data-narrow] #side .mf-b .btn{flex:1;justify-content:center;height:2.3rem}
[data-narrow] #side .navsec{overflow:visible}
[data-narrow] #side{display:flex;flex-direction:column}
[data-narrow] #side .side-tree{flex:1;min-height:6rem}
[data-narrow] #menu-scrim{display:block;position:fixed;inset:0;z-index:90;background:rgba(3,6,14,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
:root[data-theme="light"][data-narrow] #menu-scrim{background:rgba(200,210,230,.5)}
[data-narrow] #menu-scrim.on{opacity:1;pointer-events:auto}
[data-narrow] #top{grid-row:1;gap:.4rem;padding:.4rem .55rem;padding-top:calc(.4rem + env(safe-area-inset-top));padding-left:calc(.55rem + env(safe-area-inset-left));padding-right:calc(.55rem + env(safe-area-inset-right));min-height:3.3rem;height:auto}
[data-narrow] #top .ttl,[data-narrow] #top .live,[data-narrow] #top .tools{display:none}
[data-narrow] #b-menu{display:grid;width:2.5rem;height:2.5rem;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
[data-narrow] #b-menu svg{width:1.25rem;height:1.25rem}
[data-narrow] .datenav{flex:1;min-width:0;justify-content:space-between}
[data-narrow] .datebtn{flex:1;min-width:0;padding:.1rem .3rem}
[data-narrow] .datebtn span{font-size:.6rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--acc);font-weight:700}
[data-narrow] .datebtn b{font-size:.98rem}
[data-narrow] .datebtn b small{font-size:.75em;color:var(--tx3);font-weight:600}
[data-narrow] .datenav .ib{width:2.3rem;height:2.3rem}
[data-narrow] #turno button{padding:.42rem .62rem;font-size:.78rem}
[data-narrow] #subh{display:flex;align-items:center;gap:.45rem;padding:.3rem .55rem;padding-left:calc(.55rem + env(safe-area-inset-left));padding-right:calc(.55rem + env(safe-area-inset-right));grid-row:2;min-height:2.7rem;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
[data-narrow] #subh .backbtn{height:2.1rem;max-width:42%;font-size:.74rem}
[data-narrow] #subh .presbtn{width:2.3rem;height:2.3rem;border-radius:11px;color:var(--acc);background:var(--accbg)}
[data-narrow] #main{grid-row:3;padding:.55rem .55rem .5rem;padding-left:calc(.55rem + env(safe-area-inset-left));padding-right:calc(.55rem + env(safe-area-inset-right))}
[data-narrow] #bnav{display:flex;grid-row:4;justify-content:space-around;align-items:stretch;border-top:1px solid var(--line);background:var(--panelS);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:.2rem .3rem calc(.2rem + env(safe-area-inset-bottom));z-index:20}
[data-lay="phone"][data-or="land"] #bnav{display:none}
#bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.12rem;padding:.35rem 0 .3rem;font-size:.64rem;font-weight:600;color:var(--tx3);border-radius:12px;position:relative;transition:color .25s}
#bnav button svg{width:1.32rem;height:1.32rem;transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
#bnav button.on{color:var(--acc)}
#bnav button.on svg{transform:translateY(-1px) scale(1.08)}
#bnav button.on:before{content:"";position:absolute;top:-.2rem;left:32%;right:32%;height:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:growX .35s both}
#bnav .bn-ask svg{width:2.3rem;height:2.3rem;padding:.48rem;margin-top:-.55rem;border-radius:50%;color:#061020;background:conic-gradient(from var(--ang,0deg),var(--acc),var(--acc2),var(--good),var(--acc));animation:spin 7s linear infinite;box-shadow:0 8px 20px -6px var(--acc)}
#bnav .bn-ask{color:var(--tx2)}
[data-narrow] #toast{right:.6rem;left:.6rem;bottom:calc(4.6rem + env(safe-area-inset-bottom));align-items:stretch}
[data-lay="phone"][data-or="land"] #toast{bottom:.8rem;left:auto;max-width:24rem}
[data-narrow] .toast{max-width:none}
@keyframes sheetin{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
[data-narrow] .drawer{width:100vw;padding-top:env(safe-area-inset-top)}
[data-narrow] .gate{padding:.8rem}
[data-narrow] .g-card{padding:1.2rem 1.1rem}
[data-narrow] .g-row input{min-width:0;font-size:16px}
[data-touch] input,[data-touch] select{font-size:16px}
[data-touch] .srch input{font-size:16px}
.drawer.out,#drawer.out .drawer{animation:slideR .3s forwards}
@keyframes fadeout{to{opacity:0}}
@keyframes slideR{to{transform:translateX(100%)}}
.setp{width:min(24rem,calc(100vw - 20px))}
[data-narrow] .pop{max-width:calc(100vw - 16px)}

/* ---------- o conteúdo de cada painel se adapta à largura do próprio painel ---------- */
.pnl{container-type:inline-size}
@container (max-width:620px){
  .pnl-h{flex-wrap:wrap;row-gap:.35rem}
  .pnl-h .r{order:4;flex-basis:100%;margin-left:0;overflow-x:auto;scrollbar-width:none;justify-content:flex-start}
  .pnl-h .r::-webkit-scrollbar{display:none}
  .pnl-h .r .legend{display:none}
  .pnl-h>div[style]{flex:1}
  .rk-head,.rk-row{grid-template-columns:.85rem minmax(0,1.25fr) minmax(0,1fr) 5rem;gap:.45rem}
  .rk-head>:last-child,.rk-row>:last-child{display:none!important}
  .db-row{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 4.6rem;gap:.45rem}
  .dv-row{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) 4.8rem!important;gap:.45rem}
  .ww-row,.ww-head{grid-template-columns:minmax(0,1.25fr) 3.2rem 1.5rem 3.2rem 4.5rem;gap:.3rem}
  .cmp{grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
  .hero{grid-template-columns:minmax(0,1fr)}
  .stats.prof{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mv{gap:.45rem}
  .mv-it span{display:none}
  .mv-it{padding:.3rem .4rem}
}
@container (max-width:400px){
  .rk-head,.rk-row{grid-template-columns:.8rem minmax(0,1.4fr) minmax(0,.9fr) 4.4rem;gap:.35rem}
  .rk-name span{display:none}
  .rk-row .bar .val{font-size:.7rem}
  .chip{font-size:.64rem;padding:.1rem .4rem}
  .db-row,.dv-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 4rem!important}
  .ww-row,.ww-head{grid-template-columns:minmax(0,1.1fr) 2.8rem 1.1rem 2.8rem 3.9rem}
  .hm .hl{font-size:.62rem}
  .pnl-h .sub{display:none}
}
@container (max-width:250px){
  .kpi .kx{display:none}
  .kpi .ks{font-size:.66rem}
}
@media (hover:none){.chart .hov:hover{fill:transparent}.rk-row:hover,.db-row:hover,.dv-row:hover,.ww-row:hover{background:transparent}.card:hover{transform:none}}

/* ---------- filtro ≥ 10% | Todos e marca-texto ---------- */
.seg.scope button{padding:.36rem .7rem}
.scopebtn{display:none;align-items:center;gap:.35rem;height:2.1rem;padding:0 .7rem;border-radius:99px;border:1px solid var(--line2);font-size:.74rem;font-weight:700;color:var(--tx2);flex:none;background:var(--panel2);transition:.25s}
.scopebtn i{width:.62rem;height:.62rem;border-radius:50%;background:var(--flat);box-shadow:0 0 0 3px var(--flatbg)}
.scopebtn.all{color:#2a2000;background:linear-gradient(100deg,#ffe066,#ffd23f);border-color:transparent}
.scopebtn.all i{background:#2a2000;box-shadow:none}
[data-narrow] .scopebtn{display:inline-flex}
.mk{background-image:linear-gradient(100deg,rgba(255,226,64,0) 0,rgba(255,226,64,.9) 3%,rgba(255,214,38,.82) 96%,rgba(255,214,38,0) 100%);background-repeat:no-repeat;background-size:100% 86%;background-position:0 70%;color:#1d1600!important;border-radius:3px;padding:0 .22em;margin:0 -.1em;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:marker .7s cubic-bezier(.3,.8,.3,1) both;animation-delay:calc(var(--k,0)*45ms + 250ms)}
@keyframes marker{from{background-size:0% 86%}to{background-size:100% 86%}}
.rk-row.hl10{background:linear-gradient(90deg,rgba(255,214,38,.10),transparent 60%)}
.rk-row.hl10:before,.db-row.hl10:before,.dv-row.hl10:before,.ww-row.hl10:before,.lnr.hl10:before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:3px;background:#ffd23f;box-shadow:0 0 8px #ffd23f}
.db-row,.dv-row,.ww-row{position:relative}
.hx{color:inherit}
@container (max-width:620px){.hx{display:none}}
/* ---------- rodapé com páginas ---------- */
.lfoot{display:flex;align-items:center;gap:.6rem;justify-content:space-between;padding:.35rem .3rem 0;font-size:.72rem;color:var(--tx3);flex:none;min-height:1.9rem;flex-wrap:nowrap}
.lfoot .lf-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lfoot .lnk{white-space:nowrap}
.lpg{display:inline-flex;align-items:center;gap:.25rem;flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:.1rem}
.lpb{width:1.75rem;height:1.6rem;border-radius:99px;display:grid;place-items:center;color:var(--acc);transition:.2s}
.lpb:hover:not(:disabled){background:var(--accbg)}
.lpb:disabled{opacity:.3;cursor:default}
.lpb svg{width:.95rem;height:.95rem}
[data-touch] .lpb{width:2.3rem;height:2rem}
.lpn{font-size:.72rem;color:var(--tx3);min-width:3.4rem;text-align:center}
.lpn b{color:var(--tx);font-size:.8rem}
.pg-l>*{animation:pgl .45s cubic-bezier(.2,.8,.2,1) both!important;animation-delay:calc(var(--k,0)*25ms)!important}
.pg-r>*{animation:pgr .45s cubic-bezier(.2,.8,.2,1) both!important;animation-delay:calc(var(--k,0)*25ms)!important}
@keyframes pgl{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pgr{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.rk-more.lfoot{margin-top:auto}

/* ---------- semana dia a dia ---------- */
.ln-sumw{padding:.6rem}
.ln-sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.55rem;height:100%}
.ln-t{display:flex;flex-direction:column;gap:.12rem;padding:.5rem .7rem;border-radius:13px;background:linear-gradient(150deg,var(--cbg),transparent 70%),var(--panel2);border:1px solid var(--line);min-width:0;animation:pop .55s both;animation-delay:calc(var(--k,0)*70ms + 80ms)}
.ln-l{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;white-space:nowrap}
.ln-t>b{font-size:1.7rem;font-weight:760;line-height:1.05;color:var(--c)}
.ln-s{font-size:.68rem;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln-x{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.15rem;max-height:2.9rem;overflow:hidden}
.ln-n{font-size:.62rem;padding:.08rem .4rem;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--tx2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln-n:hover{border-color:var(--acc);color:var(--tx)}
.ln-more{font-size:.62rem;color:var(--tx3);align-self:center}
@container (max-width:900px){.ln-sum{grid-template-columns:repeat(3,minmax(0,1fr))}.ln-t:nth-child(n+4){grid-column:span 1}.ln-x{display:none}}
@container (max-width:460px){.ln-sum{grid-template-columns:repeat(2,minmax(0,1fr))}.ln-t:last-child{grid-column:1/3}.ln-t>b{font-size:1.4rem}}
.lnh,.lnr{display:grid;align-items:center;gap:.2rem .35rem}
.lnh{font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);padding:0 .3rem .3rem;border-bottom:1px solid var(--line)}
.lnh span{text-align:center;white-space:nowrap;overflow:hidden}
.lnh span:first-child{text-align:left}
.lnh .cur{color:var(--acc);font-weight:800}
.lnh [data-day]{cursor:pointer}
.lnl{display:flex;flex-direction:column}
.lnr{height:var(--rh,2.4rem);padding:0 .3rem;border-radius:9px;cursor:pointer;position:relative;animation:slidein .55s both;animation-delay:calc(var(--k,0)*40ms + 100ms)}
.lnr+.lnr{border-top:1px solid var(--line)}
@media (hover:hover){.lnr:hover{background:var(--panel2)}}
.lnr.hl10{background:linear-gradient(90deg,rgba(255,214,38,.09),transparent 55%)}
.lnc{height:72%;border-radius:7px;display:grid;place-items:center;font-size:.74rem;font-weight:700;background:var(--track);color:var(--tx2);animation:cellin .45s both;animation-delay:calc(var(--k,0)*35ms + var(--c2,0)*90ms + 150ms);min-width:0}
.lnc.na{background:transparent;border:1px dashed var(--line);color:var(--tx3);font-weight:500;font-size:.62rem}
.lnc.cur{box-shadow:0 0 0 2px var(--acc)}
@keyframes cellin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.lna{text-align:center;font-size:.72rem;color:var(--c);font-weight:800;animation:fadein .4s both;animation-delay:calc(var(--k,0)*35ms + var(--c2,0)*90ms + 260ms)}
.ln-tag{font-style:normal;font-size:.58rem;font-weight:700;padding:.03rem .35rem;border-radius:5px;background:var(--cbg);color:var(--c);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
@container (max-width:620px){.lnh,.lnr{gap:.15rem}.lnc{font-size:.66rem}.lna{font-size:.6rem}}
.fxcol{display:flex!important;flex-direction:column}
.fxcol>.lnl,.fxcol>.db,.fxcol>.dv,.fxcol>.rk-list{flex:1;min-height:0;height:auto!important}
.fxcol>.lfoot,.fxcol>.lnh,.fxcol>.in-h{flex:none}
.dv{display:flex;flex-direction:column}
/* cabeçalho do resumo e herói do raio-x em telas estreitas */
.view.stack .rs-head{flex-direction:column!important;align-items:stretch!important;gap:.5rem!important}
.rs-btns{display:flex;gap:.45rem;flex:none;align-items:center;flex-wrap:wrap}
.view.stack .rs-head>div:first-child>div:last-child{display:none}
.view.stack .rs-head>div:nth-child(2){overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.view.stack .rs-btns .btn{flex:1;justify-content:center}
[data-lay="phone"] .rs-btns .btn span{font-size:.72rem}
.view.stack .hero{grid-template-columns:minmax(0,1fr)!important;gap:.6rem}
.view.stack .hero .hero-id h2{font-size:1.1rem}
.view.stack .hero .hero-v .big{font-size:2.3rem}
.view.stack .hero .cmp{grid-template-columns:repeat(3,minmax(0,1fr));gap:.35rem}
.view.stack .hero .cmp-t{padding:.35rem .45rem}
.view.stack .hero .cmp-t .tv{font-size:1rem}
.view.stack .hero .cmp-t .tr{font-size:.6rem}
.view.stack .hero .cmp-t .arrow{font-size:.66rem}
.view.stack .hero .bullet{margin-top:.9rem}
.page>[data-fit],.view.stack .rs-head,.view.stack .ln-sumw{flex:none!important}
.fxcol>.cards{flex:1;min-height:0;height:auto}
.worst .wr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* posições fixas na grade (a camada do dossiê ocupa a mesma célula da área principal) */
#side{grid-column:1;grid-row:1/3}
#top{grid-column:2;grid-row:1}
#main{grid-column:2;grid-row:2}
[data-narrow] #side{grid-column:auto;grid-row:auto}
[data-narrow] #top{grid-column:1;grid-row:1}
[data-narrow] #subh{grid-column:1;grid-row:2}
[data-narrow] #main{grid-column:1;grid-row:3}
[data-narrow] #bnav{grid-column:1;grid-row:4}
#app.ov-dos #b-back,#app.ov-pres #b-back{display:none!important}

/* ---------- evidência, margem, saúde da base, prioridades ---------- */
.ev{font-style:normal;font-size:.62rem;font-weight:650;line-height:1.2;text-align:center;padding:.18rem .5rem;border-radius:99px;cursor:help;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;animation:pop .5s .6s both}
.ev-strong{color:var(--tx);background:var(--accbg);box-shadow:inset 0 0 0 1px var(--acc)}
.ev-mid{color:var(--tx2);background:var(--accbg)}
.ev-weak{color:var(--tx3);background:var(--nonebg);box-shadow:inset 0 0 0 1px var(--line2);font-weight:500}
.mg{color:var(--tx3);cursor:help;border-bottom:1px dotted var(--line2)}
.warnbar{display:flex;gap:.45rem;align-items:flex-start;font-size:.72rem;line-height:1.35;color:var(--tx);background:var(--flatbg);border:1px solid color-mix(in srgb,var(--flat) 45%,transparent);border-radius:10px;padding:.35rem .55rem;cursor:help;animation:pop .5s both}
.warnbar svg{width:.95rem;height:.95rem;flex:none;color:var(--flat);margin-top:.05rem}
.warnchip{display:inline-flex;align-items:center;gap:.3rem;margin-left:.35rem;padding:.08rem .5rem;border-radius:99px;font-size:.7rem;font-weight:600;color:var(--flat);background:var(--flatbg);cursor:help;white-space:nowrap;vertical-align:middle;animation:blink 2.4s ease-in-out 3}
.warnchip svg{width:.8rem;height:.8rem}
.sd-h{margin:1rem 0 .3rem;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.sd-h:first-child{margin-top:0}
.nx-date{cursor:default;gap:.45rem}
.nx-date input{flex:none;width:9.2rem;max-width:45%;min-width:0;font:inherit;font-size:.74rem;color:var(--tx);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:.15rem .35rem;color-scheme:dark}
:root[data-theme="light"] .nx-date input{color-scheme:light}
.nx-date .qi{flex:none}
.pql{flex:1;min-height:0;display:flex;flex-direction:column}
.pqr{display:grid;grid-template-columns:1.7rem minmax(0,1fr) 5.6rem 3.4rem;align-items:center;gap:.6rem;height:var(--rh,3.4rem);padding:0 .45rem;border-radius:12px;cursor:pointer;position:relative;animation:slidein .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*55ms + 120ms);transition:background .2s}
.pqr+.pqr{border-top:1px solid var(--line)}
.pqr:hover{background:var(--panel2)}
.pqr:before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--c,var(--line2));box-shadow:0 0 10px -2px var(--c,transparent)}
.pq-n{font-weight:800;font-size:.9rem;color:var(--tx3);text-align:center}
.pq-b{min-width:0;display:flex;flex-direction:column;gap:.15rem}
.pq-t{display:flex;align-items:center;gap:.4rem;min-width:0}
.pq-t b{font-size:.86rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pq-t .chip{flex:none;font-size:.6rem}
.pq-t small{font-size:.66rem;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pq-w{font-size:.7rem;color:var(--tx2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pq-w b{color:var(--tx);font-weight:650}
.pq-sp svg{width:100%;height:1.6rem;display:block}
.pq-sc{display:flex;flex-direction:column;align-items:center;line-height:1}
.pq-sc b{font-size:1.35rem;font-weight:800;color:var(--c,var(--tx))}
.pq-sc small{font-size:.58rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-top:.15rem}
@container (max-width:560px){.pqr{grid-template-columns:1.3rem minmax(0,1fr) 2.8rem;gap:.4rem}.pq-sp{display:none}.pq-t small{display:none}}
@container (max-width:380px){.pq-t .chip{display:none}}

/* anel da evisceradora em cartões estreitos */
@container (max-width:230px){.kring svg{width:46px;height:46px}.kring .num{font-size:.7rem!important}.kpi.kev{gap:.5rem!important}}

.warnmini{width:2.1rem;height:2.1rem;border-radius:10px;display:grid;place-items:center;color:var(--flat);background:var(--flatbg);flex:none;animation:blink 2.4s ease-in-out 3}
.warnmini svg{width:1.05rem;height:1.05rem}
#warn2:empty{display:none}

/* =====================================================================
   DOSSIÊ DO ITEM
   ===================================================================== */
.dos{grid-column:2;grid-row:2;z-index:30;display:flex;flex-direction:column;min-height:0;min-width:0;background:radial-gradient(1000px 500px at 80% -10%,rgba(90,209,255,.07),transparent 60%),var(--bg0);border-left:1px solid var(--line);clip-path:inset(0 0 0 0 round 0);transition:clip-path .55s cubic-bezier(.2,.8,.2,1),opacity .4s;position:relative}
.dos.pop{animation:dospop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes dospop{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:none}}
.dos.closing{opacity:0;pointer-events:none;transition:clip-path .42s cubic-bezier(.4,0,.2,1),opacity .42s}
:root[data-theme="light"] .dos{background:radial-gradient(1000px 500px at 80% -10%,rgba(10,143,208,.06),transparent 60%),var(--bg0)}
[data-narrow] .dos{grid-column:1;grid-row:2/5;border-left:0;padding-bottom:env(safe-area-inset-bottom)}
.dos-h{display:flex;align-items:center;gap:.8rem;padding:.6rem .9rem .35rem;flex:none;min-width:0}
.dos-h .backbtn{display:inline-flex}
.dos-id{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:1rem;align-items:center}
.dos-k{grid-column:1;font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dos-id h2{grid-column:1;font-size:1.3rem;font-weight:720;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:slidein .5s both}
.dos-v{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:.15rem}
.dos-v b{font-size:1.9rem;font-weight:780;line-height:1;color:var(--c);text-shadow:0 0 24px var(--cbg)}
.dos-v small{font-size:.66rem;color:var(--tx3)}
.dos-act{display:flex;gap:.3rem;flex:none}
.dos-act .ib{width:2.3rem;height:2.3rem;border-radius:11px;border:1px solid var(--line)}
.dos-pres{color:var(--acc)!important;background:var(--accbg)}
.dos-tabs{display:flex;gap:.25rem;padding:.15rem .9rem .35rem;flex:none;overflow-x:auto;scrollbar-width:none}
.dos-tabs::-webkit-scrollbar{display:none}
.dtab{display:flex;align-items:center;gap:.4rem;padding:.42rem .8rem;border-radius:11px;font-size:.8rem;font-weight:650;color:var(--tx3);flex:none;position:relative;transition:color .25s,background .25s}
.dtab svg{width:1rem;height:1rem}
.dtab:hover{color:var(--tx);background:var(--panel2)}
.dtab.on{color:var(--tx);background:linear-gradient(180deg,var(--accbg),transparent)}
.dtab.on:after{content:"";position:absolute;left:18%;right:18%;bottom:-.1rem;height:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:growX .35s both}
.dos-sug{display:flex;gap:.35rem;align-items:center;padding:.1rem .9rem .5rem;flex:none;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.dos-sug::-webkit-scrollbar{display:none}
.sg-l{display:flex;align-items:center;gap:.3rem;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);flex:none;white-space:nowrap}
.sg-l svg{width:.85rem;height:.85rem;color:var(--acc)}
.sg{display:flex;align-items:center;gap:.35rem;flex:none;font-size:.74rem;font-weight:600;padding:.32rem .7rem;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx2);white-space:nowrap;transition:.22s;animation:pop .45s both;animation-delay:calc(var(--k,0)*40ms + 150ms)}
.sg svg{width:.85rem;height:.85rem;color:var(--acc)}
.sg:hover{border-color:var(--acc);color:var(--tx);background:var(--accbg);transform:translateY(-1px)}
.sg.on{border-color:var(--acc);color:#061020;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.sg.on svg{color:#061020}
.dos-chips{flex:none;padding:0 .9rem}
.dos-chips:empty{display:none}
.dos-b{flex:1;min-height:0;min-width:0;padding:.2rem .9rem .9rem;position:relative}
[data-narrow] .dos-h{padding:.45rem .55rem .25rem;gap:.45rem}
[data-narrow] .dos-h .backbtn{max-width:32%;height:2.1rem;font-size:.72rem}
[data-narrow] .dos-id{grid-template-columns:minmax(0,1fr) auto;column-gap:.5rem}
[data-narrow] .dos-id h2{font-size:1.02rem}
[data-narrow] .dos-k{font-size:.56rem}
[data-narrow] .dos-v b{font-size:1.35rem}
[data-narrow] .dos-v .chip,[data-narrow] .dos-v small{display:none}
[data-narrow] .dos-act .ib{width:2.2rem;height:2.2rem}
[data-narrow] .dos-tabs{padding:.1rem .55rem .3rem}
[data-narrow] .dtab{padding:.38rem .6rem;font-size:.76rem}
[data-narrow] .dos-sug{padding:.05rem .55rem .4rem}
[data-narrow] .dos-chips{padding:0 .55rem .35rem}
[data-narrow] .dos-b{padding:.1rem .55rem .5rem}
[data-lay="phone"][data-or="land"] .dos-sug{display:none}
#app.ov-dos #subh{visibility:hidden}

/* blocos do dossiê */
.dh-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.1rem;align-items:center;height:100%}
.dh-v{text-align:left}
.dh-v .big{font-size:3.1rem;font-weight:790;line-height:1;color:var(--c);text-shadow:0 0 30px var(--cbg)}
.dh-v .lb{font-size:.74rem;color:var(--tx2);margin-top:.3rem;display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.dh-t{display:flex;flex-direction:column;gap:.45rem;font-size:.78rem;color:var(--tx2);min-width:0}
.dh-t .bullet{margin-top:1rem}
@container (max-width:460px){.dh-hero{grid-template-columns:minmax(0,1fr);gap:.4rem}.dh-v .big{font-size:2.6rem}}
.rtiles{display:grid;gap:.5rem;height:100%}
.rtile{display:flex;flex-direction:column;justify-content:space-between;gap:.1rem;text-align:left;padding:.5rem .65rem;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,var(--cbg),transparent 70%),var(--panel2);min-width:0;transition:transform .2s,border-color .2s;animation:pop .55s both;animation-delay:calc(var(--k,0)*60ms + 120ms)}
.rtile:hover{transform:translateY(-2px);border-color:var(--acc)}
.rt-l{font-size:.62rem;letter-spacing:.03em;text-transform:uppercase;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtile b{font-size:1.15rem;font-weight:720}
.rt-d{font-size:.74rem;font-weight:700;color:var(--c);white-space:nowrap}
.rt-go{font-size:.64rem;color:var(--acc);font-weight:600;opacity:.75}
@container (max-width:640px){.rtiles{grid-template-columns:repeat(3,minmax(0,1fr))!important}.rtile:nth-child(n+4){display:none}}
@container (max-width:380px){.rtiles{grid-template-columns:repeat(2,minmax(0,1fr))!important}.rtile:nth-child(n+3){display:none}}
.wstrip{display:grid;align-items:stretch;gap:.35rem;height:calc(100% - 1.5rem);justify-content:start}
.ws-d{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-width:4.6rem;padding:.4rem .5rem;border-radius:13px;border:1px solid var(--line);background:var(--panel2);animation:pop .5s both;animation-delay:calc(var(--k,0)*70ms + 100ms);transition:transform .2s}
.ws-d:hover{transform:translateY(-2px)}
.ws-d.hot{background:var(--hb);color:var(--hc);border-color:transparent}
.ws-d.cur{box-shadow:0 0 0 2px var(--acc),0 10px 26px -12px var(--acc)}
.ws-w{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.ws-d b{font-size:1.25rem;font-weight:760}
.ws-d small{font-size:.6rem;opacity:.75;white-space:nowrap}
.ws-ar{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.66rem;color:var(--c);font-weight:700;animation:fadein .5s both;animation-delay:calc(var(--k,0)*70ms + 200ms)}
.ws-ar b{font-size:.9rem}
.ws-f{font-size:.64rem;color:var(--tx3);margin-top:.3rem;display:flex;align-items:center;gap:.2rem}
@container (max-width:520px){.ws-d{min-width:3.2rem;padding:.3rem .25rem}.ws-d b{font-size:1rem}.ws-d small{display:none}.wstrip{gap:.2rem}}
.mini-l{display:flex;flex-direction:column;height:100%}
.ml-r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.5rem;align-items:center;font-size:.76rem;padding:0 .35rem;border-bottom:1px solid var(--line);border-radius:6px;animation:slidein .45s both;animation-delay:calc(var(--k,0)*40ms + 100ms);cursor:pointer}
.ml-r.cur{background:var(--accbg)}
.ml-r small{color:var(--tx3);font-size:.64rem}
.ml-r b{padding:.05rem .4rem;border-radius:6px;font-weight:700;min-width:3.4rem;text-align:center}
.brk-r{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 3.6rem;gap:.5rem;align-items:center;animation:slidein .45s both;animation-delay:calc(var(--k,0)*50ms + 100ms)}
.brk-r b{font-size:.78rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brk-r small{font-size:.62rem;color:var(--tx3)}
.brk-r>b.num{text-align:right;font-size:.86rem}
.tot-l{display:flex;flex-direction:column;gap:.35rem;height:100%;justify-content:center}
.tot-r{display:grid;grid-template-columns:minmax(0,1fr) auto 4.2rem 5.2rem;gap:.5rem;align-items:center;text-align:left;padding:.45rem .6rem;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-size:.78rem;animation:slidein .45s both;animation-delay:calc(var(--k,0)*60ms + 100ms);transition:border-color .2s}
.tot-r:not(.first):hover{border-color:var(--acc)}
.tot-r.first{background:var(--accbg);border-color:var(--acc)}
.tot-r small{color:var(--tx3);font-size:.64rem}
.tot-r b{text-align:right;font-size:.95rem}
.tot-r em{font-style:normal;text-align:right}
.tot-ref{font-size:.62rem;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.rank-hd{font-size:.8rem;color:var(--tx2);margin-bottom:.35rem}
.tt-sc{display:flex;flex-direction:column;justify-content:center;height:100%}
/* comparação A × B */
.cmp-head{display:flex;flex-direction:column;gap:.55rem;height:100%;justify-content:center}
.cmp-q{display:flex;align-items:center;gap:.45rem;font-size:.76rem;color:var(--tx2);font-weight:600}
.cmp-q svg{width:1rem;height:1rem;color:var(--acc);flex:none}
.cmp-s{font-size:.8rem;line-height:1.5;color:var(--tx2)}
.cmp-s b{color:var(--tx)}
.vs2{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.7rem;align-items:stretch}
.vs2-s{border-radius:15px;padding:.65rem .8rem;border:1px solid var(--line);display:flex;flex-direction:column;gap:.2rem;min-width:0;animation:vsin .7s cubic-bezier(.2,.9,.3,1.15) both}
.vs2-s.a{background:linear-gradient(150deg,rgba(90,209,255,.16),transparent 70%),var(--panel2);--c:var(--acc)}
.vs2-s.b{background:linear-gradient(210deg,rgba(143,125,255,.16),transparent 70%),var(--panel2);--c:var(--acc2);animation-name:vsin2}
@keyframes vsin{from{opacity:0;transform:translateX(-40px) scale(.95)}to{opacity:1;transform:none}}
@keyframes vsin2{from{opacity:0;transform:translateX(40px) scale(.95)}to{opacity:1;transform:none}}
.vs2-l{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs2-v{font-size:2.3rem;font-weight:790;line-height:1.05;color:var(--c)}
.vs2-n{font-size:.68rem;color:var(--tx2)}
.vs2-bar{position:relative;height:.5rem;border-radius:99px;background:var(--track);margin-top:.35rem}
.vs2-bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:var(--c);box-shadow:0 0 12px -2px var(--c);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.vs2-bar .thr{position:absolute;top:-.25rem;bottom:-.25rem;width:2px;background:var(--thr)}
.vs2-m{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;padding:0 .2rem;animation:pop .6s .35s both}
.vs2-m b{font-size:1.05rem;font-weight:800;color:var(--c);white-space:nowrap;padding:.3rem .6rem;border-radius:99px;background:var(--cbg);box-shadow:0 0 22px -6px var(--c)}
.vs2-m span{font-size:.66rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
@container (max-width:520px){.vs2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:.45rem}.vs2-m{grid-column:1/3;grid-row:2;flex-direction:row}.vs2-v{font-size:1.8rem}}
.kv3{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.35rem .9rem;font-size:.78rem;color:var(--tx2)}
.kv3 b{text-align:right;color:var(--tx)}
.in-h,.in-r{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(0,.8fr) 4.4rem;gap:.5rem;align-items:center}
.in-h{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);padding:0 .3rem .25rem;border-bottom:1px solid var(--line)}
.in-h span:not(:first-child){text-align:right}
.in-r{font-size:.76rem;padding:0 .3rem;border-bottom:1px solid var(--line);animation:slidein .45s both;animation-delay:calc(var(--k,0)*50ms + 150ms)}
.in-r>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in-r b{text-align:right;font-size:.86rem}
.in-r b small{display:block;font-size:.58rem;color:var(--tx3);font-weight:500}
.in-r>span:last-child{text-align:right}
.nx-l{display:flex;flex-direction:column;gap:4px;height:100%}
.nx{display:flex;align-items:center;gap:.5rem;text-align:left;padding:0 .65rem;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-size:.76rem;color:var(--tx2);transition:.2s;animation:slidein .45s both;animation-delay:calc(var(--k,0)*45ms + 150ms)}
.nx svg{width:.95rem;height:.95rem;color:var(--acc);flex:none}
.nx span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx:hover{border-color:var(--acc);color:var(--tx);background:var(--accbg)}
.stats.st4{grid-template-columns:repeat(2,minmax(0,1fr));height:100%;grid-auto-rows:1fr}
.cz{display:flex;flex-direction:column;gap:.55rem;height:100%}
.cz-b h6{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:.35rem;margin-bottom:.3rem}
.cz-b h6 svg{width:.9rem;height:.9rem;color:var(--acc)}
.cz-r{font-size:.76rem;line-height:1.45;color:var(--tx2);padding:.4rem .55rem;border-radius:10px;background:var(--panel2);border-left:3px solid var(--c,var(--line2));margin-bottom:.3rem}
.cz-r b{color:var(--tx)}
.cz-r span{display:block}
/* hoje × cada dia da semana */
.wk{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:.8rem;align-items:stretch;height:100%}
.wk-today,.wk-c{display:flex;flex-direction:column;justify-content:center;gap:.2rem;border-radius:15px;padding:.6rem .8rem;border:1px solid var(--line);background:var(--panel2);min-width:0;text-align:left;animation:pop .6s both;animation-delay:calc(var(--k,0)*90ms + 100ms)}
.wk-today{background:linear-gradient(150deg,var(--cbg),transparent 70%),var(--panel2);border-color:var(--c);box-shadow:0 14px 34px -18px var(--c);min-width:9rem}
.wk-today b{font-size:2.5rem;font-weight:800;color:var(--c);line-height:1}
.wk-d{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3)}
.wk-today small,.wk-c small{font-size:.64rem;color:var(--tx3)}
.wk-today em,.wk-c em{font-style:normal;font-size:.64rem;color:var(--tx3)}
.wk-vs{align-self:center;font-weight:800;color:var(--tx3);letter-spacing:.1em;font-size:.8rem}
.wk-cs{display:grid;gap:.55rem}
.wk-c{transition:transform .2s,border-color .2s}
.wk-c:hover{transform:translateY(-2px);border-color:var(--acc)}
.wk-c b{font-size:1.4rem;font-weight:740;align-self:flex-start;padding:0 .3rem;border-radius:7px}
.wk-dl{font-size:.82rem;font-weight:800;color:var(--c)}
.wk-l{list-style:none;display:flex;flex-direction:column;gap:.45rem;font-size:.8rem;line-height:1.45;color:var(--tx2)}
.wk-l li{padding:.4rem .6rem;border-radius:10px;background:var(--panel2);border-left:3px solid var(--acc);animation:slidein .5s both;animation-delay:calc(var(--k,0)*90ms + 200ms)}
.wk-l b{color:var(--tx)}
@container (max-width:600px){.wk{grid-template-columns:minmax(0,1fr);gap:.45rem}.wk-vs{display:none}.wk-today{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}.wk-today b{font-size:1.9rem}.wk-c b{font-size:1.1rem}.wk-c em{display:none}}

/* =====================================================================
   MODO APRESENTAÇÃO
   ===================================================================== */
.pres{position:fixed;inset:0;z-index:300;display:grid;grid-template-rows:auto minmax(0,1fr) 3px auto;background:radial-gradient(1200px 700px at 72% -12%,rgba(90,209,255,.14),transparent 60%),radial-gradient(900px 640px at 8% 112%,rgba(143,125,255,.14),transparent 60%),#050913;color:var(--tx);opacity:0;transform:scale(.97);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1),clip-path .7s cubic-bezier(.2,.8,.2,1);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
:root[data-theme="light"] .pres{background:radial-gradient(1200px 700px at 72% -12%,rgba(10,143,208,.12),transparent 60%),radial-gradient(900px 640px at 8% 112%,rgba(106,78,230,.10),transparent 60%),#f2f5fb}
.pres.from{clip-path:circle(0 at var(--ox,50%) var(--oy,50%))}
.pres.on{opacity:1;transform:none;clip-path:circle(160% at var(--ox,50%) var(--oy,50%))}
.pres.off{opacity:0;transform:scale(.96);clip-path:circle(0 at var(--ox,50%) var(--oy,50%));transition:opacity .4s,transform .45s,clip-path .5s cubic-bezier(.4,0,.2,1)}
.pr-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 1.3rem .2rem;font-size:.78rem;color:var(--tx3);min-width:0}
.pr-brand{display:flex;align-items:center;gap:.55rem;min-width:0;white-space:nowrap;overflow:hidden}
.pr-brand b{color:var(--tx);font-weight:700}
.pr-brand #pr-kick{overflow:hidden;text-overflow:ellipsis}
.pr-brand #pr-kick:before{content:"·";margin-right:.5rem}
.pr-logo{width:1.8rem;height:1.8rem;border-radius:9px;display:grid;place-items:center;background:conic-gradient(from var(--ang,0deg),var(--acc),var(--acc2),var(--good),var(--acc));animation:spin 6s linear infinite;color:#061020;flex:none}
.pr-logo svg{width:1rem;height:1rem}
.pr-n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--tx2);flex:none}
.pr-stage{position:relative;overflow:hidden;font-size:var(--sf,20px);min-height:0}
.pr-prog{background:var(--track)}
.pr-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--good));box-shadow:0 0 12px var(--acc)}
.pr-bar{display:flex;align-items:center;gap:.4rem;padding:.55rem 1rem .7rem;justify-content:center;flex-wrap:nowrap}
.pr-sp{flex:1}
.pr-b{display:inline-flex;align-items:center;gap:.4rem;height:2.6rem;min-width:2.6rem;justify-content:center;padding:0 .8rem;border-radius:13px;border:1px solid var(--line2);background:var(--panel2);font-size:.82rem;font-weight:650;color:var(--tx);transition:.2s;flex:none}
.pr-b svg{width:1.1rem;height:1.1rem}
.pr-b:hover:not(:disabled){border-color:var(--acc);background:var(--accbg)}
.pr-b:disabled{opacity:.3}
.pr-b.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#061020;border-color:transparent}
.pr-x{color:var(--tx2)}
.pr-dots{display:flex;gap:.35rem;align-items:center;max-width:46vw;overflow:hidden;padding:0 .3rem}
.pr-dots button{width:.55rem;height:.55rem;border-radius:99px;background:var(--line2);transition:width .35s cubic-bezier(.2,.8,.2,1),background .3s;flex:none}
.pr-dots button.on{width:1.8rem;background:var(--acc);box-shadow:0 0 10px var(--acc)}
[data-lay="phone"] .pr-b span{display:none}
[data-lay="phone"] .pr-b{height:2.5rem;padding:0 .6rem}
[data-lay="phone"] .pr-top{padding:.55rem .8rem .1rem}
/* slide */
.pslide{position:absolute;inset:0;padding:.9em 2em .8em;display:flex;flex-direction:column;min-height:0}
.pslide.port{padding:.8em .9em}
.pslide.sin-r{animation:slInR .75s cubic-bezier(.2,.8,.2,1) both}
.pslide.sin-l{animation:slInL .75s cubic-bezier(.2,.8,.2,1) both}
.pslide.sin-z{animation:slInZ .8s cubic-bezier(.2,.8,.2,1) both}
.pslide.sout-l{animation:slOutL .6s cubic-bezier(.4,0,.2,1) both;pointer-events:none}
.pslide.sout-r{animation:slOutR .6s cubic-bezier(.4,0,.2,1) both;pointer-events:none}
@keyframes slInR{from{opacity:0;transform:translateX(9%) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes slInL{from{opacity:0;transform:translateX(-9%) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes slInZ{from{opacity:0;transform:scale(.92);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes slOutL{to{opacity:0;transform:translateX(-7%) scale(.97);filter:blur(4px)}}
@keyframes slOutR{to{opacity:0;transform:translateX(7%) scale(.97);filter:blur(4px)}}
.sl-c{display:flex;flex-direction:column;gap:.75em;height:100%;min-height:0}
.sl-c>*{animation:slUp .8s cubic-bezier(.2,.8,.2,1) both}
.sl-c>*:nth-child(2){animation-delay:.12s}.sl-c>*:nth-child(3){animation-delay:.24s}.sl-c>*:nth-child(4){animation-delay:.36s}
@keyframes slUp{from{opacity:0;transform:translateY(.8em)}to{opacity:1;transform:none}}
.sl-h{display:flex;flex-direction:column;gap:.2em;flex:none}
.sl-k{font-size:.55em;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:700}
.sl-h h1{font-size:1.75em;font-weight:780;line-height:1.08;letter-spacing:-.01em}
.sl-h p{font-size:.68em;color:var(--tx2)}
.sl-c.cover{justify-content:center}
.sl-c.cover .sl-h h1{font-size:2.3em}
.sl-lead{font-size:.82em;line-height:1.45;color:var(--tx2);flex:none}
.sl-lead b{color:var(--tx)}
.sl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.2em,1fr));gap:.55em;flex:none}
.sl-st{display:flex;flex-direction:column;gap:.15em;padding:.6em .75em;border-radius:.65em;border:1px solid var(--line2);background:linear-gradient(150deg,var(--cbg),transparent 70%),var(--panel2);animation:pop .7s both;animation-delay:calc(var(--k,0)*110ms + 250ms)}
.sl-sl{font-size:.5em;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.sl-st b{font-size:2em;font-weight:800;color:var(--c,var(--tx));line-height:1.05}
.sl-st b small{font-size:.45em;color:var(--tx3);font-weight:600}
.sl-ss{font-size:.52em;color:var(--tx2)}
.sl-bars{display:flex;flex-direction:column;gap:.38em;flex:1;min-height:0;justify-content:center}
.sl-br{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,2fr) 3.6em 6.2em;gap:.6em;align-items:center;font-size:.78em;animation:slidein .7s both;animation-delay:calc(var(--k,0)*90ms + 250ms)}
.sl-bn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-bn small{display:block;font-size:.66em;color:var(--tx3);font-weight:500}
.sl-bt{position:relative;height:.62em;border-radius:99px;background:var(--track)}
.sl-bt .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cbg),var(--c));box-shadow:0 0 .8em -.1em var(--c);transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.sl-bt .thr{position:absolute;top:-.25em;bottom:-.25em;width:.12em;background:var(--thr)}
.sl-br>b{text-align:right;font-weight:800;color:var(--c)}
.sl-bc{text-align:right}
.sl-bc .chip{font-size:.62em}
.sl-chart{flex:1;min-height:6em;position:relative}
.sl-it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.4em;align-items:center;flex:none}
.sl-big{display:flex;flex-direction:column;gap:.15em}
.sl-big b{font-size:3.6em;font-weight:820;line-height:1;color:var(--c);text-shadow:0 0 .6em var(--cbg)}
.sl-ch{font-size:.72em;font-weight:700;color:var(--c)}
.sl-big small{font-size:.56em;color:var(--tx3)}
.sl-wk{display:flex;flex-direction:column;gap:.35em;min-width:0}
.sl-wbs{display:flex;align-items:center;gap:.25em;flex-wrap:wrap}
.sl-wb{display:flex;flex-direction:column;align-items:center;padding:.35em .55em;border-radius:.5em;background:var(--panel2);border:1px solid var(--line);min-width:3.4em;animation:pop .6s both;animation-delay:calc(var(--k,0)*110ms + 350ms)}
.sl-wb span{font-size:.48em;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.sl-wb b{font-size:1em;font-weight:780}
.sl-wb.cur{box-shadow:0 0 0 .12em var(--acc)}
.sl-wa{font-style:normal;color:var(--tx3);font-size:.8em}
.sl-mvs{display:grid;grid-template-columns:1fr 1fr;gap:1em;flex:1;min-height:0}
.sl-mv h3{font-size:.7em;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin-bottom:.4em}
.sl-mvi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.05em .6em;padding:.45em .65em;border-radius:.5em;border-left:.18em solid var(--c);background:linear-gradient(90deg,var(--cbg),transparent 85%);margin-bottom:.35em;font-size:.72em;animation:slidein .6s both;animation-delay:calc(var(--k,0)*110ms + 300ms)}
.sl-mvi span{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-mvi small{grid-column:1;color:var(--tx3);font-size:.8em}
.sl-mvi b{grid-row:1/3;grid-column:2;align-self:center;color:var(--c);font-weight:800}
.sl-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:1em;align-items:center;flex:1;min-height:0}
.sl-vsi{display:flex;flex-direction:column;align-items:center;gap:.2em;padding:.9em;border-radius:.8em;background:linear-gradient(160deg,var(--cbg),transparent 75%),var(--panel2);border:1px solid var(--line2);animation:vsin .8s cubic-bezier(.2,.9,.3,1.15) both}
.sl-vsi:last-child{animation-name:vsin2}
.sl-vsi span{font-size:.7em;font-weight:800;letter-spacing:.1em;color:var(--c)}
.sl-vsi b{font-size:3.4em;font-weight:820;line-height:1}
.sl-vsi small{font-size:.55em;color:var(--tx2)}
.sl-vsm{font-size:.9em;font-weight:800;color:var(--c,var(--tx3));letter-spacing:.06em;padding:.3em .7em;border-radius:99px;background:var(--cbg,transparent);animation:pop .7s .4s both;white-space:nowrap}
.sl-list{display:flex;flex-direction:column;gap:.5em;flex:1;min-height:0;justify-content:center}
.sl-li{display:flex;flex-direction:column;gap:.15em;padding:.55em .8em;border-radius:.6em;background:var(--panel2);border-left:.2em solid var(--c,var(--acc));font-size:.78em;animation:slidein .6s both;animation-delay:calc(var(--k,0)*120ms + 300ms)}
.sl-li b{font-weight:780}
.sl-li b em{font-style:normal;font-size:.7em;color:var(--c);text-transform:uppercase;letter-spacing:.06em;margin-left:.4em}
.sl-li span{color:var(--tx2);font-size:.85em;line-height:1.4}
.sl-wdc{display:flex;gap:.55em;flex:none;flex-wrap:wrap}
.sl-wd{flex:1;min-width:5em;display:flex;flex-direction:column;align-items:center;gap:.1em;padding:.55em .5em;border-radius:.65em;border:1px solid var(--line2);background:linear-gradient(160deg,var(--cbg),transparent 70%),var(--panel2);animation:pop .65s both;animation-delay:calc(var(--k,0)*120ms + 250ms)}
.sl-wd span{font-size:.5em;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3)}
.sl-wd b{font-size:1.7em;font-weight:800;color:var(--c)}
.sl-wd small{font-size:.52em;font-weight:700;color:var(--c)}
.sl-wd.cur{border-color:var(--c);box-shadow:0 .6em 1.5em -.8em var(--c)}
.sl-cmp{flex:none;container-type:inline-size}
@container (max-width:520px){.pslide .vs2-v{font-size:2.1em}.pslide .vs2-m{flex-wrap:wrap;justify-content:center}}
.pslide .vs2{gap:.8em}
.pslide .vs2-s{padding:.7em .9em;border-radius:.7em}
.pslide .vs2-l{font-size:.5em}
.pslide .vs2-v{font-size:2.8em}
.pslide .vs2-n{font-size:.52em}
.pslide .vs2-bar{height:.4em;margin-top:.3em}
.pslide .vs2-m b{font-size:.95em}
.pslide .vs2-m span{font-size:.5em}
.pslide .chart text{font-family:var(--font)}
/* retrato (celular em pé) */
.pslide.port .sl-it{grid-template-columns:minmax(0,1fr);gap:.6em}
.pslide.port .sl-big b{font-size:3em}
.pslide.port .sl-mvs{grid-template-columns:minmax(0,1fr);gap:.5em}
.pslide.port .sl-br{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 3.2em;font-size:.7em}
.pslide.port .sl-bc{display:none}
.pslide.port .sl-vs{grid-template-columns:minmax(0,1fr);gap:.5em}
.pslide.port .sl-vsi b{font-size:2.6em}
.pslide.port .sl-h h1{font-size:1.4em}
.pslide.port .sl-c.cover .sl-h h1{font-size:1.7em}
.pslide.port .sl-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.pslide.port .sl-st b{font-size:1.6em}
.pslide.port .sl-wd{min-width:3.4em}
.pslide.port .sl-wd b{font-size:1.25em}

/* =====================================================================
   PADRÕES DOS MONITORAMENTOS · viradas · persistência · famílias · corrida · cascata
   ===================================================================== */
.calc{color:var(--tx3);font-weight:500;font-size:.8em;animation:blink 1.2s ease-in-out infinite}
.nav button .k.nw{border:0;color:#061020;background:linear-gradient(135deg,var(--acc),var(--good));font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:.56rem;padding:.08rem .35rem}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.view.stack .kpis.k4,.view.stack .kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
.fxcol>.vrl,.fxcol>.pso,.fxcol>.fml,.fxcol>.vln{flex:1;min-height:0;height:auto!important}
.fxcol>.vln-ax{flex:none}
/* ---------- faixa de contexto do Panorama ---------- */
.ctxs{flex-direction:row;align-items:stretch;padding:.45rem .55rem;gap:.55rem;background:linear-gradient(100deg,rgba(90,209,255,.07),transparent 40%,rgba(143,125,255,.07)),var(--panel)}
.cxs-h{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:.3rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);flex:none;padding:0 .2rem;line-height:1.25}
.cxs-h .qi{margin-left:0}
.cxs-k{display:flex;align-items:center;gap:.4rem;color:var(--acc);font-weight:700}
.cxs-k svg{width:1.15rem;height:1.15rem;flex:none}
.cxs-l{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.5rem;flex:1;min-height:0}
.cx-t{display:flex;align-items:center;gap:.55rem;min-width:0;text-align:left;padding:.35rem .55rem;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,var(--cbg),transparent 75%);transition:transform .25s,border-color .25s;animation:pop .6s both;animation-delay:calc(var(--k,0)*70ms + 120ms)}
.cx-t:hover{transform:translateY(-2px);border-color:var(--c,var(--acc))}
.cx-t.st-none{--c:var(--acc);--cbg:var(--accbg)}
.cx-ic{width:1.9rem;height:1.9rem;border-radius:10px;display:grid;place-items:center;background:var(--cbg);color:var(--c);flex:none}
.cx-ic svg{width:1.05rem;height:1.05rem}
.cx-x{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.cx-l{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-v{font-size:.9rem;font-weight:750;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-s{font-size:.64rem;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-t.wait .cx-ic{animation:blink 1.2s ease-in-out infinite}
@container (max-width:1100px){.cxs-l{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (max-width:640px){.cxs-l{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:420px){.cxs-l{grid-template-columns:minmax(0,1fr)}}
.view.stack .ctxs{flex-direction:column}
.view.stack .ctxs .cxs-h{flex-direction:row;align-items:center}
.view.stack .ctxs .cxs-k br{display:none}
.view.stack .ctxs .cxs-l{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}
[data-lay="phone"][data-or="port"] .view.stack .ctxs .cxs-l{grid-template-columns:minmax(0,1fr)}
/* ---------- navegação de mês (máquina do tempo) ---------- */
.mnav{display:inline-flex;align-items:center;gap:.15rem;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.08rem;white-space:nowrap}
.mnav .ib{width:1.6rem;height:1.6rem}
.mnav .ib svg{width:.9rem;height:.9rem}
.mnav b{font-size:.86rem;font-weight:700;padding:0 .35rem;text-transform:none}
/* ---------- previsão ---------- */
.rk-top{display:flex;gap:.8rem;align-items:center;flex:none;margin-bottom:.45rem;padding:.4rem .6rem;border-radius:12px;background:linear-gradient(135deg,var(--accbg),transparent 75%);border:1px solid var(--line)}
.rk-big{display:flex;flex-direction:column;min-width:0}
.rk-big>span{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.rk-big b{font-size:2.2rem;font-weight:800;line-height:1.05;color:var(--acc)}
.rk-big>small{font-size:.66rem;color:var(--tx2)}
.rk-mini{display:flex;flex-direction:column;gap:.15rem;margin-left:auto;font-size:.68rem;color:var(--tx2);text-align:right}
.rk-mini b{color:var(--tx);font-size:.82rem}
.pp-r{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 3rem;gap:.55rem;align-items:center;height:var(--rh,2.2rem);padding:0 .35rem;border-radius:9px;cursor:pointer;animation:slidein .6s both;animation-delay:calc(var(--k,0)*35ms + 80ms)}
.pp-r:hover{background:var(--panel2)}
.pp-r+.pp-r{border-top:1px solid var(--line)}
.pp-r.st-none{--c:var(--acc);--cbg:var(--accbg)}
.pp-p{text-align:right;font-weight:800;color:var(--c);font-size:.86rem}
.rel{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:.6rem;height:100%}
.rel-c{position:relative;min-height:0}
.rel-s{display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:.4rem;min-height:0}
.rel-s .stat{padding:.3rem .5rem;justify-content:center;min-height:0;overflow:hidden}
.rel-s .stat .sv{font-size:1.05rem}
.rel-s .stat .ss{font-size:.6rem;line-height:1.25}
.tm-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex:none;margin-bottom:.4rem;flex-wrap:wrap}
.tm-s{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem;flex:none;margin-bottom:.4rem}
.tm-s div{display:flex;flex-direction:column;padding:.3rem .45rem;border-radius:10px;background:var(--panel2);border:1px solid var(--line);min-width:0}
.tm-s>div>span{font-size:.58rem;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-s b{font-size:1.2rem;font-weight:800;color:var(--acc)}
.tm-r{display:grid;grid-template-columns:1.2rem minmax(0,1fr) minmax(0,.8fr) 3.6rem;gap:.5rem;align-items:center;height:var(--rh,2rem);padding:0 .3rem;font-size:.76rem;animation:slidein .5s both;animation-delay:calc(var(--k,0)*35ms)}
.tm-r+.tm-r{border-top:1px solid var(--line)}
.tm-i{font-weight:900;text-align:center}
.tm-r.ok .tm-i{color:var(--good)}
.tm-r.miss .tm-i{color:var(--bad)}
.tm-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.tm-p{position:relative;height:1rem;border-radius:99px;background:var(--track);overflow:hidden;display:flex;align-items:center}
.tm-p i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accbg),var(--acc));border-radius:99px}
.tm-p b{position:relative;font-size:.64rem;padding-left:.4rem;color:var(--tx);font-weight:800}
.tm-v{text-align:right;font-weight:700;color:var(--tx2)}
.tm-v.hot{color:var(--bad)}
@container (max-width:620px){.rel{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}.rel-s{grid-template-rows:none;grid-template-columns:repeat(2,minmax(0,1fr))}.tm-s{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- cascata: de onde veio a diferença ---------- */
.wfhost{display:flex;flex-direction:column;min-height:0}
.wf-h{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.74rem;color:var(--tx2);flex:none;margin-bottom:.35rem}
.wf-h b{color:var(--tx)}
.wf-lg{margin-left:auto;display:flex;align-items:center;gap:.35rem;color:var(--tx3);font-size:.66rem}
.wf-lg i{display:inline-block;width:.7rem;height:.7rem;border-radius:3px}
.wf-lg i.up{background:var(--bad)}.wf-lg i.dn{background:var(--good)}
.wf{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;gap:2px}
.wf-r{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.6fr) 3.6rem;gap:.6rem;align-items:center;min-height:0;flex:1;max-height:2.4rem;padding:0 .3rem;border-radius:8px;animation:slidein .55s both;animation-delay:calc(var(--k,0)*90ms + 80ms)}
.wf-r[data-item]{cursor:pointer}
.wf-r:hover{background:var(--panel2)}
.wf-n{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;flex-direction:column;line-height:1.15}
.wf-n small{font-size:.6rem;color:var(--tx3);font-weight:500}
.wf-t{position:relative;height:62%;min-height:.75rem}
.wf-b{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--wc);transform-origin:left;animation:growX .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*90ms + 200ms);box-shadow:0 0 12px -3px var(--wc)}
.wf-up{--wc:var(--bad)}.wf-dn{--wc:var(--good)}.wf-rest{--wc:var(--tx3)}
.wf-dn .wf-b{transform-origin:right}
.wf-tot{--wc:linear-gradient(90deg,color-mix(in srgb,var(--acc) 35%,transparent),var(--acc))}
.wf-tot .wf-b{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 30%,transparent),var(--acc));box-shadow:0 0 14px -4px var(--acc)}
.wf-tot .wf-n{color:var(--acc);font-weight:800}
.wf-cut{position:absolute;left:-.15rem;top:-15%;bottom:-15%;width:.35rem;background:repeating-linear-gradient(160deg,var(--panelS) 0 3px,transparent 3px 6px);opacity:.9}
.wf-lk{position:absolute;top:-35%;bottom:-35%;width:0;border-left:1px dashed var(--line2)}
.wf-v{text-align:right;font-size:.78rem;font-weight:800;color:var(--wc)}
.wf-tot .wf-v{color:var(--tx)}
.wf-rest .wf-v{color:var(--tx2)}
.wf.big .wf-r{max-height:2.6em;font-size:1em;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 4.4em}
.wf.big .wf-n{font-size:.72em}
.wf.big .wf-n small{font-size:.62em}
.wf.big .wf-v{font-size:.78em}
@container (max-width:520px){.wf-r{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 3rem;gap:.35rem}.wf-n small{display:none}}

/* ---------- viradas ---------- */
.vr-r{display:grid;grid-template-columns:3.1rem minmax(0,1.3fr) 6.6rem 4.4rem 3.6rem;gap:.55rem;align-items:center;height:var(--rh,2.6rem);padding:0 .35rem;border-radius:10px;cursor:pointer;position:relative;animation:slidein .55s both;animation-delay:calc(var(--k,0)*40ms + 60ms)}
.vr-r+.vr-r{border-top:1px solid var(--line)}
.vr-r:hover{background:var(--panel2)}
.vr-r.on{background:var(--accbg)}
.vr-r:before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--c)}
.vr-d{display:flex;flex-direction:column;align-items:center;line-height:1.05;font-weight:800;font-size:.86rem;color:var(--c)}
.vr-d small{font-size:.58rem;color:var(--tx3);font-weight:600}
.vr-ab{font-size:.78rem;color:var(--tx2);text-align:right;white-space:nowrap}
.vr-ab b{color:var(--c);font-weight:800}
.vr-ab i{font-style:normal;color:var(--tx3)}

.fh-ax{flex:none;height:1.05rem}
.fh-n{font-size:.7rem;font-weight:600;display:flex;flex-direction:column;line-height:1.1;min-width:0}
.fh-n>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh-n small{font-size:.58rem;color:var(--tx3);font-weight:500;white-space:nowrap}
.fh-top .fh-n{color:var(--tx2);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase}
.fh-c{display:grid;grid-template-columns:repeat(var(--nc),minmax(0,1fr));gap:2px;height:100%;min-height:0}
.fh-x{position:relative;border-radius:3px;background:var(--track);cursor:pointer;animation:fhIn .45s both;animation-delay:calc(var(--j)*24ms + var(--k,0)*45ms + 120ms);transition:transform .15s}
.fh-x:after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:var(--a,0)}
.fh-x.hot:after{background:var(--bad)}
.fh-x.cool:after{background:var(--good)}
.fh-x.na{background:repeating-linear-gradient(135deg,var(--track) 0 2px,transparent 2px 5px);cursor:default}
.fh-x.hit:before{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#fff;z-index:1;box-shadow:0 0 4px rgba(0,0,0,.5)}
.fh-x.up{box-shadow:0 0 8px -3px var(--bad)}
.fh-x.cur,.fh-k.cur{outline:1.5px solid var(--acc);outline-offset:1px}
.fh-x.col,.fh-k.col{transform:scale(1.12);z-index:2}
.fh-k{position:relative;display:flex;align-items:flex-end;justify-content:center;height:100%;cursor:pointer;border-radius:3px;background:linear-gradient(180deg,transparent,var(--track))}
.fh-k s{display:block;width:100%;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,var(--fc),color-mix(in srgb,var(--fc) 35%,transparent));transform-origin:bottom;animation:growY .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--j)*24ms + 80ms)}
.fh-k.all s{background:linear-gradient(180deg,var(--bad),color-mix(in srgb,var(--bad) 35%,transparent));box-shadow:0 0 10px -2px var(--bad)}
.fh-k b{position:absolute;top:-.05rem;left:0;right:0;text-align:center;font-size:.56rem;font-weight:800;color:var(--tx2);pointer-events:none}
.fh-k.all b{color:var(--bad)}
.fh-ax em{font-style:normal;font-size:.56rem;color:var(--tx3);white-space:nowrap;overflow:visible;text-align:left}
.fh-ax em.cur{color:var(--acc);font-weight:800}
@keyframes fhIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.fh.sl{font-size:1em;gap:.18em;--nl:minmax(7em,24%);justify-content:center}
.fh.sl .fh-r{max-height:2.4em}
.fh.sl .fh-top{max-height:3.4em}
.fh.sl .fh-n{font-size:.58em}.fh.sl .fh-top .fh-n{font-size:.48em}.fh.sl .fh-k b{font-size:.46em}.fh.sl .fh-ax em{font-size:.44em}
@container (max-width:520px){.fh{--nl:minmax(5rem,30%)}.fh-n small{display:none}}
.tr-o.lf span{left:auto;right:calc(var(--r) + 3px)}
/* ---------- pódio em slide ---------- */
.sl-pdm{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.6em;flex:1;min-height:0}
.spd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7em;align-items:end;height:100%;min-height:0}
.spd-c{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-height:0;gap:.45em;min-width:0}
.spd-n{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.1em;animation:slUp .7s both;animation-delay:calc(var(--k,0)*260ms + 750ms);min-width:0}
.spd-n em{font-style:normal;font-size:1.25em;font-weight:850;color:var(--bad);line-height:1}
.spd-n b{font-size:.62em;font-weight:780;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.spd-n span{font-size:.46em;color:var(--tx3);letter-spacing:.04em;text-transform:uppercase}
.spd-b{position:relative;border-radius:.55em .55em .15em .15em;background:linear-gradient(180deg,var(--mc),color-mix(in srgb,var(--mc) 22%,transparent));box-shadow:0 0 2em -.6em var(--mc),inset 0 .12em 0 rgba(255,255,255,.35);display:flex;justify-content:center;padding-top:.35em;transform-origin:bottom;animation:growY .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*260ms + 250ms)}
.p1 .spd-b{height:56%;--mc:#ffc247}
.p2 .spd-b{height:40%;--mc:#c6d2e6}
.p3 .spd-b{height:28%;--mc:#e38f55}
.spd-b i{font-style:normal;font-size:1.4em;font-weight:900;color:rgba(5,10,25,.72)}
.p1 .spd-n em{font-size:1.55em}
.spd-r{display:flex;flex-direction:column;justify-content:center;gap:1em;min-height:0}
.spd-l{display:flex;flex-direction:column;gap:.4em}
.spd-l h5{display:flex;align-items:center;gap:.4em;font-size:.5em;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:750}
.spd-l h5 svg{width:1.2em;height:1.2em;color:var(--acc)}
.spd-l .sl-li{font-size:.66em;padding:.45em .7em}
.spd-d{font-weight:800;color:var(--c)}
.pslide.port .sl-pdm{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.2fr) auto}
/* ---------- apresentação no celular: nada passa da largura da tela ---------- */
.pres{grid-template-columns:minmax(0,1fr)}
.pr-bar,.pr-top{min-width:0}
[data-lay="phone"] .pr-dots,[data-lay="phone"] #pr-lsb,[data-lay="phone"] #pr-blb{display:none}
[data-lay="phone"] .pr-bar{gap:.3rem;padding:.5rem .6rem .65rem}
@media (max-width:700px){.pr-dots{max-width:30vw}}
.kpi .kv .mnav{font-size:1rem}
.kpi .kv .mnav b{font-size:1.15rem}
/* ---------- slides: previsão e ações ---------- */
.sl-rel{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1em;flex:1;min-height:0}
.sl-rel .sl-chart{min-height:0}
.sl-acts{display:flex;flex-direction:column;gap:.55em;flex:1;justify-content:center;min-height:0}
.sl-act{display:grid;grid-template-columns:2.1em minmax(0,1fr);gap:.7em;align-items:center;padding:.55em .8em;border-radius:.7em;background:linear-gradient(100deg,var(--accbg),transparent 70%),var(--panel2);border:1px solid var(--line2);animation:slidein .7s both;animation-delay:calc(var(--k,0)*140ms + 300ms)}
.sl-act i{font-style:normal;width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;font-weight:850;font-size:.8em;color:#061020;background:linear-gradient(135deg,var(--acc),var(--good))}
.sl-act b{display:block;font-size:.8em;font-weight:780}
.sl-act span{display:block;font-size:.6em;color:var(--tx2);line-height:1.35}
.pslide.port .sl-rel{grid-template-columns:minmax(0,1fr)}
/* ---------- apresentação: capítulos, visão geral, notas, laser ---------- */
.pr-ch{display:flex;gap:.3rem;align-items:center;min-width:0;overflow:hidden;flex:1;justify-content:center}
.pr-ch button{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.22rem .6rem;border-radius:99px;color:var(--tx3);border:1px solid var(--line);white-space:nowrap;transition:.25s}
.pr-ch button.on{color:#061020;background:linear-gradient(135deg,var(--acc),var(--good));border-color:transparent;box-shadow:0 0 14px -2px var(--acc)}
.pr-ch button.done{color:var(--tx2);border-color:var(--line2)}
.pr-ch i{width:.9rem;height:1px;background:var(--line2);flex:none}
[data-lay="phone"] .pr-ch{display:none}
.pr-b.on2{color:var(--acc);border-color:var(--acc);background:var(--accbg)}
.pr-notes{position:absolute;left:50%;bottom:4.6rem;transform:translateX(-50%) translateY(20px);width:min(54rem,92vw);padding:.7rem 1rem .75rem;border-radius:16px;background:var(--panelS);border:1px solid var(--line2);box-shadow:0 20px 50px -20px rgba(0,0,0,.6);font-size:.86rem;line-height:1.5;color:var(--tx2);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:5}
.pr-notes.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.pr-notes b{display:block;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:.2rem}
.pr-over{position:absolute;inset:3.2rem 1rem 4.4rem;z-index:6;display:none;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.6rem;align-content:start;overflow:auto;padding:.6rem;border-radius:18px;background:var(--bg1);backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:0 30px 70px -20px rgba(0,0,0,.7);scrollbar-width:thin}
.pr-over.on{display:grid;animation:popin .25s cubic-bezier(.2,.8,.2,1)}
.pr-ovi{display:flex;flex-direction:column;gap:.2rem;text-align:left;padding:.6rem .7rem;border-radius:12px;border:1px solid var(--line);background:var(--panel2);min-height:5rem;transition:.2s;animation:pop .45s both;animation-delay:calc(var(--k,0)*25ms)}
.pr-ovi:hover{border-color:var(--acc);transform:translateY(-2px)}
.pr-ovi.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg)}
.pr-ovi small{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.pr-ovi b{font-size:.86rem;color:var(--tx)}
.pr-ovi span{font-size:.68rem;color:var(--tx3)}
.pr-laser{position:fixed;z-index:400;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,#ff3355 30%,rgba(255,51,85,.35) 60%,transparent 70%);box-shadow:0 0 18px 6px rgba(255,51,85,.55);pointer-events:none;display:none}
.pres.laser{cursor:none}
.pres.laser .pr-laser{display:block}
.pchoose{width:min(25rem,calc(100vw - 20px));display:flex;flex-direction:column;gap:.5rem}
.pchoose h4{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.pc-o{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:.7rem;align-items:center;text-align:left;padding:.65rem .75rem;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);transition:.2s}
.pc-o:hover{border-color:var(--acc);background:var(--accbg)}
.pc-o i{width:2.4rem;height:2.4rem;border-radius:12px;display:grid;place-items:center;background:var(--accbg);color:var(--acc)}
.pc-o i svg{width:1.2rem;height:1.2rem}
.pc-o.big i{background:conic-gradient(from var(--ang,0deg),var(--acc),var(--acc2),var(--good),var(--acc));animation:spin 6s linear infinite;color:#061020}
.pc-o b{display:block;font-size:.86rem}
.pc-o span{display:block;font-size:.72rem;color:var(--tx2);line-height:1.35}
.pc-k{font-size:.66rem;color:var(--tx3)}

/* =====================================================================
   TEMA CLARO · contraste reforçado (o escuro não muda)
   ===================================================================== */
:root[data-theme="light"]{
  --bg0:#e3e9f3;--bg1:#d9e2ef;--panel:#ffffff;--panel2:rgba(16,36,84,.045);--panelS:#ffffff;
  --line:rgba(16,36,84,.17);--line2:rgba(16,36,84,.32);--track:rgba(16,36,84,.13);
  --tx:#050d22;--tx2:#25334f;--tx3:#4f5d7a;
  --acc:#0067c0;--acc2:#5524d6;--accbg:rgba(0,103,192,.13);
  --t1:#0072c4;--t2:#6a29e0;--tA:#8c5500;--t1bg:rgba(0,114,196,.14);--t2bg:rgba(106,41,224,.13);
  --bad:#d1002f;--good:#007f52;--flat:#b36200;--none:#53647f;
  --badbg:rgba(209,0,47,.12);--goodbg:rgba(0,127,82,.12);--flatbg:rgba(179,98,0,.14);--nonebg:rgba(83,100,127,.13);
  --thr:#c26a00;--shadow:0 1px 2px rgba(10,30,70,.10),0 10px 26px -14px rgba(10,30,70,.35);
  --blobA:rgba(40,120,255,.10);--blobB:rgba(120,70,255,.08);--blobC:rgba(0,180,150,.06);
  --gridln:rgba(20,50,110,.06);--tipbg:#ffffff
}
:root[data-theme="light"] .pnl{border-color:rgba(16,36,84,.18);backdrop-filter:none}
:root[data-theme="light"] #side{background:#f8fafd}
:root[data-theme="light"] #top{background:linear-gradient(180deg,#f3f6fb,rgba(243,246,251,.6))}
:root[data-theme="light"] .bar .fill,:root[data-theme="light"] .sl-bt .fill,:root[data-theme="light"] .bullet .fill{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));box-shadow:none}

:root[data-theme="light"] .chip{background:color-mix(in srgb,var(--c) 15%,#fff);border:1px solid color-mix(in srgb,var(--c) 35%,#fff)}
:root[data-theme="light"] .chart text{fill:#3c4a66}
:root[data-theme="light"] .chart .gl{stroke:rgba(16,36,84,.14)}
:root[data-theme="light"] .chart .thr{stroke-width:1.8;opacity:1}

:root[data-theme="light"] .rk-name span,:root[data-theme="light"] .pnl-h .sub{color:#4a5876}
:root[data-theme="light"] .nav button{color:#2b3956}

:root[data-theme="light"] .leaf{color:#2b3956}
:root[data-theme="light"] .mv-it,:root[data-theme="light"] .card,:root[data-theme="light"] .cmp-t,:root[data-theme="light"] .cx-t{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,#fff),#fff 80%)}
:root[data-theme="light"] .card:before{box-shadow:none}
:root[data-theme="light"] .ctxs{background:linear-gradient(100deg,rgba(0,103,192,.06),#fff 45%,rgba(85,36,214,.05))}
:root[data-theme="light"] .tag{background:#eef2f8;border-color:rgba(16,36,84,.2);color:#3c4a66}
:root[data-theme="light"] .stat{background:#f4f7fb;border-color:rgba(16,36,84,.16)}
:root[data-theme="light"] .seg{background:#eef2f8}
:root[data-theme="light"] .seg button{color:#46557a}
:root[data-theme="light"] .seg button.on{color:#04112b}
:root[data-theme="light"] .hm .hc.na{border-color:rgba(16,36,84,.18)}
:root[data-theme="light"] .cal-g .cd{background:rgba(16,36,84,.10)}

:root[data-theme="light"] .sl-st,:root[data-theme="light"] .sl-vsi,:root[data-theme="light"] .sl-wd{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 14%,#fff),#fff 75%);border-color:rgba(16,36,84,.2)}

:root[data-theme="light"] #bgfx{background:radial-gradient(1200px 800px at 85% -10%,#edf2f9,transparent 70%),var(--bg0)}

/* ======================= FILTRO DE ITENS ======================= */
.fltbtn{display:inline-flex;align-items:center;gap:.4rem;height:2.25rem;padding:0 .8rem 0 .65rem;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);font-size:.78rem;font-weight:650;color:var(--tx2);flex:none;white-space:nowrap;position:relative;transition:color .2s,background .2s,border-color .2s,box-shadow .25s;max-width:13rem}
.fltbtn svg{width:1rem;height:1rem;flex:none}
.fltbtn span{overflow:hidden;text-overflow:ellipsis}
.fltbtn:hover{color:var(--tx);border-color:var(--acc)}
.fltbtn.on{color:#04121f;background:linear-gradient(120deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--good)));border-color:transparent;box-shadow:0 6px 22px -8px var(--acc)}
.fltbtn.on i{position:absolute;top:-.22rem;right:-.22rem;width:.62rem;height:.62rem;border-radius:50%;background:var(--flat);box-shadow:0 0 0 2px var(--bg1);animation:fpulse 2.4s ease-in-out infinite}
@keyframes fpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media (max-width:1500px){.fltbtn:not(.on) span{display:none}.fltbtn:not(.on){padding:0 .55rem}}
@media (max-width:1380px){.fltbtn.on{max-width:8.5rem}}
.fltbtn.fb-m{display:none}
[data-narrow] .fltbtn.fb-m{display:inline-flex;height:2.1rem;border-radius:99px;padding:0 .65rem;font-size:.72rem;max-width:9rem}
[data-narrow] .fltbtn.fb-m:not(.on) span{display:none}
[data-narrow] .fltbtn.fb-m:not(.on){padding:0 .55rem}

/* faixa sobre a área principal: mesma célula da grade que o #main */
.fbar{grid-column:2;grid-row:2;align-self:start;z-index:6;margin:.55rem .85rem 0;pointer-events:none;min-width:0}
[data-narrow] .fbar{grid-column:1;grid-row:3;margin:.4rem .55rem 0}
#app.flt-on #main{padding-top:3.15rem}
[data-narrow] #app.flt-on #main{padding-top:2.75rem}
.fb-in{pointer-events:auto;display:flex;align-items:center;gap:.6rem;height:2.15rem;padding:0 .35rem 0 .5rem;border-radius:12px;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);background:linear-gradient(100deg,color-mix(in srgb,var(--acc) 20%,var(--panelS)),var(--panelS) 70%);box-shadow:0 10px 30px -18px var(--acc);font-size:.76rem;min-width:0;animation:fbin .35s cubic-bezier(.2,.8,.2,1) both}
.fb-in.hide{border-color:color-mix(in srgb,var(--flat) 60%,transparent);background:linear-gradient(100deg,color-mix(in srgb,var(--flat) 20%,var(--panelS)),var(--panelS) 70%)}
@keyframes fbin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fb-ic{width:1.5rem;height:1.5rem;border-radius:8px;display:grid;place-items:center;background:var(--acc);color:#04121f;flex:none}
.fb-in.hide .fb-ic{background:var(--flat);color:#2a1d00}
.fb-ic svg{width:.9rem;height:.9rem}
.fb-h{white-space:nowrap;color:var(--tx);flex:none}
.fb-cs{display:flex;gap:.3rem;min-width:0;overflow:hidden;flex:0 1 auto}
.fb-c{display:inline-flex;align-items:center;gap:.25rem;max-width:12rem;padding:.12rem .15rem .12rem .5rem;border-radius:99px;background:var(--accbg);color:var(--tx);font-weight:600;white-space:nowrap;border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);min-width:0}
.fb-c.fb-r{background:color-mix(in srgb,var(--good) 16%,transparent);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.fb-c svg{width:.8rem;height:.8rem;flex:none;color:var(--good)}
.fb-c button{width:1.1rem;height:1.1rem;border-radius:50%;display:grid;place-items:center;color:var(--tx2);flex:none}
.fb-c button:hover{background:var(--bad);color:#fff}
.fb-c button svg{width:.65rem;height:.65rem;color:inherit}
.fb-ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fb-more{font-size:.7rem;font-weight:700;color:var(--acc);padding:0 .3rem;flex:none}
.fb-x{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 0}
.fb-b{display:flex;gap:.25rem;margin-left:auto;flex:none}
.fb-b button{display:inline-flex;align-items:center;gap:.3rem;height:1.6rem;padding:0 .55rem;border-radius:8px;font-size:.72rem;font-weight:650;color:var(--tx2)}
.fb-b button svg{width:.85rem;height:.85rem}
.fb-b .fb-e{color:var(--tx);background:var(--panel2);border:1px solid var(--line2)}
.fb-b .fb-e:hover{border-color:var(--acc)}
.fb-b .fb-l:hover{color:var(--bad);background:var(--badbg)}
[data-narrow] .fb-in{height:1.95rem;gap:.4rem}
[data-narrow] .fb-h{overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
[data-narrow] .fb-b span{display:none}
[data-narrow] .fb-b button{padding:0 .45rem}

/* dossiê / popover */
.dos-flt{color:var(--acc)!important}
.fpop{width:min(21rem,calc(100vw - 20px));display:flex;flex-direction:column;gap:.35rem}
